<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Rastreo LT</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,500;0,9..40,700&family=JetBrains+Mono:wght@400;600;700&display=swap');

        :root {
            --bg: #0c0f14;
            --surface: #141820;
            --surface2: #1a2030;
            --border: #2a3348;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.15);
            --green: #22c55e;
            --green-dim: rgba(34, 197, 94, 0.12);
            --amber: #f59e0b;
            --amber-dim: rgba(245, 158, 11, 0.12);
            --red: #ef4444;
            --red-dim: rgba(239, 68, 68, 0.12);
            --purple: #a855f7;
            --purple-dim: rgba(168, 85, 247, 0.12);
            --cyan: #06b6d4;
            --cyan-dim: rgba(6, 182, 212, 0.12);
            --text: #e2e8f0;
            --text-dim: #64748b;
            --text-muted: #475569;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, var(--surface) 0%, var(--surface2) 100%);
            border-bottom: 1px solid var(--border);
            padding: 20px 32px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo-badge {
            height: 44px;
            display: flex;
            align-items: center;
        }

        .logo-badge img {
            height: 44px;
            width: auto;
            display: block;
        }

        .header-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 18px; font-weight: 700;
        }

        .header-title span { color: var(--accent); }

        .header-sub {
            font-size: 12px; color: var(--text-dim);
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 1px; text-transform: uppercase;
        }

        /* ORDER CARD */
        .order-card {
            margin: 24px 32px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 24px;
            animation: slideIn 0.4s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .order-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .order-id {
            font-family: 'JetBrains Mono', monospace;
            font-size: 22px; font-weight: 700;
        }

        .order-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px; font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 0.8px; text-transform: uppercase;
        }

        .badge-active { background: var(--green-dim); color: var(--green); border: 1px solid rgba(34, 197, 94, 0.25); }
        .badge-complete { background: var(--accent-glow); color: var(--accent); border: 1px solid rgba(59, 130, 246, 0.25); }

        .order-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
        }

        .detail-item {
            background: var(--surface2);
            border-radius: 10px;
            padding: 14px;
        }

        .detail-label {
            font-size: 10px; color: var(--text-dim);
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 1px; text-transform: uppercase;
            margin-bottom: 6px;
        }

        .detail-value { font-size: 15px; font-weight: 600; }

        /* VIEW TOGGLE */
        .view-toggle {
            display: flex; gap: 4px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 4px;
            margin: 0 32px 20px;
        }

        .toggle-btn {
            padding: 8px 18px; border: none;
            background: transparent; color: var(--text-dim);
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px; font-weight: 600;
            cursor: pointer; border-radius: 7px;
            transition: all 0.2s;
        }

        .toggle-btn.active {
            background: var(--accent); color: #fff;
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);
        }

        /* TIMELINE */
        .timeline-section { margin: 0 32px 40px; }

        .timeline-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px; color: var(--text-dim);
            letter-spacing: 1.5px; text-transform: uppercase;
            margin-bottom: 20px;
            display: flex; align-items: center; gap: 10px;
        }

        .timeline-title::after {
            content: ''; flex: 1; height: 1px; background: var(--border);
        }

        .timeline { position: relative; padding-left: 36px; }

        .timeline::before {
            content: ''; position: absolute;
            left: 15px; top: 8px; bottom: 8px;
            width: 2px;
            background: linear-gradient(to bottom, var(--accent), var(--border));
        }

        .timeline-item {
            position: relative; margin-bottom: 16px;
            animation: fadeSlide 0.4s ease both;
        }

        @keyframes fadeSlide {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .timeline-dot {
            position: absolute; left: -28px; top: 18px;
            width: 12px; height: 12px; border-radius: 50%;
            border: 2.5px solid var(--accent);
            background: var(--bg); z-index: 1;
        }

        .timeline-dot.ventas { border-color: var(--purple); }
        .timeline-dot.gerencia { border-color: var(--cyan); }
        .timeline-dot.desarrollo { border-color: var(--cyan); }
        .timeline-dot.produccion { border-color: var(--green); }
        .timeline-dot.revision { border-color: var(--amber); }
        .timeline-dot.acabado { border-color: var(--red); }
        .timeline-dot.empaque { border-color: var(--purple); }
        .timeline-dot.enviado { border-color: var(--green); }
        .timeline-dot.contabilidad { border-color: var(--amber); }
        .timeline-dot.active { background: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }

        .timeline-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px; padding: 18px;
            transition: all 0.2s;
        }

        .timeline-card:hover {
            border-color: var(--accent);
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
        }

        .timeline-card-header {
            display: flex; align-items: center;
            justify-content: space-between; margin-bottom: 10px;
        }

        .area-name {
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px; font-weight: 700;
        }

        .area-tag {
            padding: 3px 10px; border-radius: 6px;
            font-size: 10px; font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 0.5px;
        }

        .tag-ventas { background: var(--purple-dim); color: var(--purple); }
        .tag-gerencia { background: var(--cyan-dim); color: var(--cyan); }
        .tag-desarrollo { background: var(--cyan-dim); color: var(--cyan); }
        .tag-produccion { background: var(--green-dim); color: var(--green); }
        .tag-revision { background: var(--amber-dim); color: var(--amber); }
        .tag-acabado { background: var(--red-dim); color: var(--red); }
        .tag-reproceso { background: var(--red-dim); color: var(--red); }
        .tag-empaque { background: var(--purple-dim); color: var(--purple); }
        .tag-enviado { background: var(--green-dim); color: var(--green); }
        .tag-contabilidad { background: var(--amber-dim); color: var(--amber); }

        .timeline-meta {
            display: flex; flex-wrap: wrap; gap: 14px;
            font-size: 12px; color: var(--text-dim);
        }

        .meta-item { display: flex; align-items: center; gap: 5px; }
        .meta-item strong { color: var(--text); font-weight: 600; }

        .next-area-arrow {
            display: flex; align-items: center; gap: 6px;
            margin-top: 10px; padding-top: 10px;
            border-top: 1px solid var(--border);
            font-size: 11px; color: var(--text-dim);
            font-family: 'JetBrains Mono', monospace;
        }

        .next-area-arrow strong { color: var(--accent); }

        /* TABLE */
        .table-section { margin: 0 32px 40px; display: none; }

        .table-wrapper {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px; overflow-x: auto;
        }

        table { width: 100%; border-collapse: collapse; }

        thead th {
            background: var(--surface2); padding: 12px 16px;
            text-align: left;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px; font-weight: 700;
            color: var(--text-dim); letter-spacing: 1px;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border);
        }

        tbody td {
            padding: 12px 16px; font-size: 13px;
            border-bottom: 1px solid var(--border);
        }

        tbody tr:last-child td { border-bottom: none; }
        tbody tr:hover { background: var(--surface2); }

        .td-mono { font-family: 'JetBrains Mono', monospace; font-weight: 600; }

        /* EMPTY */
        .empty-state {
            text-align: center; padding: 80px 32px;
            display: flex; flex-direction: column; align-items: center;
        }

        .empty-icon {
            width: 80px; height: 80px;
            background: var(--surface);
            border: 2px dashed var(--border);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 32px; margin-bottom: 20px; color: var(--text-dim);
        }

        .empty-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 16px; font-weight: 700;
            margin-bottom: 8px; color: var(--text-dim);
        }

        .empty-sub { font-size: 14px; color: var(--text-muted); max-width: 400px; }

        @media (max-width: 768px) {
            .header { padding: 16px 20px; }
            .order-card { margin: 20px; }
            .timeline-section, .table-section { margin: 0 20px 30px; }
            .view-toggle { margin: 0 20px 16px; }
            .order-details { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

    <div class="header">
        <div style="display:flex;align-items:center;gap:16px;">
            <div class="logo-badge"><img src="logo.png" alt="RUBIO"></div>
            <div>
                <div class="header-title"><span>Rastreo LT</span></div>
                <div class="header-sub">Dashboard de trazabilidad</div>
            </div>
        </div>
    </div>

    <div id="emptyState" class="empty-state" style="display:none;">
        <div class="empty-icon">📦</div>
        <div class="empty-title">Sin datos</div>
        <div class="empty-sub">Usa el formulario "Buscar Orden Dashboard" en Zoho Creator para abrir este dashboard con los datos de una orden.</div>
    </div>

    <div id="content" style="display:none;">
        <div class="order-card">
            <div class="order-header">
                <div class="order-id" id="orderId">—</div>
                <div class="order-badge badge-active" id="orderBadge">EN PROCESO</div>
            </div>
            <div class="order-details" id="orderDetails"></div>
        </div>

        <div class="view-toggle">
            <button class="toggle-btn active" onclick="showView('timeline')">▸ Timeline</button>
            <button class="toggle-btn" onclick="showView('table')">▪ Tabla</button>
        </div>

        <div class="timeline-section" id="timelineSection">
            <div class="timeline-title">Movimientos</div>
            <div class="timeline" id="timeline"></div>
        </div>

        <div class="table-section" id="tableSection">
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Área</th>
                            <th>Tipo Envío</th>
                            <th>Cant. Enviada</th>
                            <th>Desperdicio</th>
                            <th>Operador</th>
                            <th>Máquina</th>
                            <th>Siguiente Área</th>
                            <th>Fecha</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

<script>
    // Leer parámetros de la URL
    const params = new URLSearchParams(window.location.search);
    const oc = params.get('oc');
    const np = params.get('np');
    const rev = params.get('rev');
    const cant = params.get('cant');
    const fecha = params.get('fecha');
    const acabado = params.get('acabado');
    const cliente = params.get('cliente');
    const sede = params.get('sede');
    const comprador = params.get('comprador');
    const area = params.get('area');
    const sig = params.get('sig');
    const acumulada = params.get('acumulada');
    const despTotal = params.get('desperdicio');
    const reproTotal = params.get('reproceso');
    const factura = params.get('factura');
    const maquila = params.get('maquila');
    const estatus = params.get('estatus');
    const estatusEmpaque = params.get('estatusEmpaque');
    const tarima = params.get('tarima');
    const primera = params.get('primera');
    const datos = params.get('datos');

    if (!oc || !datos) {
        document.getElementById('emptyState').style.display = 'flex';
    } else {
        document.getElementById('content').style.display = 'block';

        // Parsear los datos
        const registros = datos.split('~').map(row => {
            const campos = row.split('|');
            return {
                area: campos[0] || '',
                tipoEnvio: campos[1] || '',
                cantidadEnviada: parseInt(campos[2]) || 0,
                siguienteArea: campos[3] || '',
                cantidadDesperdicio: parseInt(campos[4]) || 0,
                fechaRegistro: campos[5] || '',
                operador: campos[6] || '',
                maquina: campos[7] || ''
            };
        });

        // Order Card
        document.getElementById('orderId').textContent = oc;

        const badge = document.getElementById('orderBadge');
        if (estatus === 'Enviado') {
            badge.className = 'order-badge badge-complete';
            badge.textContent = 'COMPLETADO';
        } else if (estatusEmpaque && estatusEmpaque.includes('Completado')) {
            badge.className = 'order-badge badge-complete';
            badge.textContent = 'EMPAQUE COMPLETADO';
        } else {
            badge.className = 'order-badge badge-active';
            badge.textContent = 'EN PROCESO';
        }

        document.getElementById('orderDetails').innerHTML = [
            { label: 'Número de Parte', value: np },
            { label: 'Revisión', value: rev },
            { label: 'Cantidad Solicitada', value: cant },
            { label: 'Fecha de Entrega', value: fecha },
            { label: 'Acabado', value: acabado },
            { label: 'Cliente', value: cliente },
            { label: 'Sede', value: sede },
            { label: 'Comprador', value: comprador },
            { label: 'Área Actual', value: area },
            { label: 'Siguiente Área', value: sig },
            { label: 'Factura', value: factura },
            { label: 'Orden de Maquila', value: maquila },
            { label: 'Estatus Empaque', value: estatusEmpaque },
            { label: 'Estatus Envío', value: estatus },
            { label: 'Tarima', value: tarima },
            { label: 'Total Movimientos', value: registros.length + ' registros' },
        ].map(d => `
            <div class="detail-item">
                <div class="detail-label">${d.label}</div>
                <div class="detail-value">${d.value || '—'}</div>
            </div>
        `).join('');

        // Timeline
        renderTimeline(registros);
        renderTable(registros);
    }

    function getAreaType(area) {
        const a = area.toLowerCase();
        if (a === 'ventas') return 'ventas';
        if (a === 'gerencia') return 'gerencia';
        if (a === 'desarrollo') return 'desarrollo';
        if (a.includes('ingenieria') || a.includes('calidad')) return 'revision';
        if (a === 'empaque') return 'empaque';
        if (a === 'tarimas') return 'enviado';
        if (a.includes('acabado') || a.includes('maquila')) return 'acabado';
        if (a === 'facturas' || a === 'contabilidad') return 'contabilidad';
        return 'produccion';
    }

    function getAreaTag(area, tipoEnvio) {
        if (tipoEnvio === 'Reproceso') return '<span class="area-tag tag-reproceso">REPROCESO</span>';
        const type = getAreaType(area);
        const labels = {
            ventas: 'VENTAS', gerencia: 'GERENCIA', desarrollo: 'DESARROLLO',
            revision: 'REVISIÓN', acabado: 'ACABADO', produccion: 'PRODUCCIÓN',
            empaque: 'EMPAQUE', enviado: 'ENVIADO', contabilidad: 'CONTABILIDAD'
        };
        return `<span class="area-tag tag-${type}">${labels[type] || 'PRODUCCIÓN'}</span>`;
    }

    function renderTimeline(registros) {
        document.getElementById('timeline').innerHTML = registros.map((r, i) => {
            const type = getAreaType(r.area);
            const isLast = i === registros.length - 1;
            const dotClass = isLast ? `${type} active` : type;

            let metaItems = '';
            if (r.tipoEnvio && r.tipoEnvio !== 'Revision') {
                metaItems += `<div class="meta-item">Tipo: <strong>${r.tipoEnvio}</strong></div>`;
            }
            if (r.cantidadEnviada > 0) {
                metaItems += `<div class="meta-item">Enviadas: <strong>${r.cantidadEnviada}</strong></div>`;
            }
            if (r.cantidadDesperdicio > 0) {
                metaItems += `<div class="meta-item">Desperdicio: <strong style="color:var(--red)">${r.cantidadDesperdicio}</strong></div>`;
            }
            if (r.operador) {
                metaItems += `<div class="meta-item">Operador: <strong>${r.operador}</strong></div>`;
            }
            if (r.maquina) {
                metaItems += `<div class="meta-item">Máquina: <strong>${r.maquina}</strong></div>`;
            }
            metaItems += `<div class="meta-item">Fecha: <strong>${r.fechaRegistro}</strong></div>`;

            let nextArea = '';
            if (r.siguienteArea) {
                nextArea = `<div class="next-area-arrow">→ Siguiente: <strong>${r.siguienteArea}</strong></div>`;
            }

            return `
                <div class="timeline-item" style="animation-delay: ${i * 0.08}s">
                    <div class="timeline-dot ${dotClass}"></div>
                    <div class="timeline-card">
                        <div class="timeline-card-header">
                            <div class="area-name">${r.area}</div>
                            ${getAreaTag(r.area, r.tipoEnvio)}
                        </div>
                        <div class="timeline-meta">${metaItems}</div>
                        ${nextArea}
                    </div>
                </div>
            `;
        }).join('');
    }

    function renderTable(registros) {
        document.getElementById('tableBody').innerHTML = registros.map((r, i) => `
            <tr>
                <td class="td-mono" style="color:var(--text-dim)">${i + 1}</td>
                <td><strong>${r.area}</strong></td>
                <td class="td-mono">${r.tipoEnvio || '—'}</td>
                <td class="td-mono">${r.cantidadEnviada || '—'}</td>
                <td class="td-mono" style="color:${r.cantidadDesperdicio > 0 ? 'var(--red)' : 'inherit'}">${r.cantidadDesperdicio || '0'}</td>
                <td>${r.operador || '—'}</td>
                <td>${r.maquina || '—'}</td>
                <td>${r.siguienteArea || '—'}</td>
                <td style="color:var(--text-dim);font-size:12px;">${r.fechaRegistro}</td>
            </tr>
        `).join('');
    }

    function showView(view) {
        const btns = document.querySelectorAll('.toggle-btn');
        btns.forEach(b => b.classList.remove('active'));
        if (view === 'timeline') {
            btns[0].classList.add('active');
            document.getElementById('timelineSection').style.display = 'block';
            document.getElementById('tableSection').style.display = 'none';
        } else {
            btns[1].classList.add('active');
            document.getElementById('timelineSection').style.display = 'none';
            document.getElementById('tableSection').style.display = 'block';
        }
    }
</script>

</body>
</html>
