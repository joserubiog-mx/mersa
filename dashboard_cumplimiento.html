<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cumplimiento de Entregas</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=DM+Sans:wght@400;500;700&display=swap');
:root{
  --bg:#0c0f14; --surface:#141820; --surface2:#1a2030; --border:#2a3348;
  --accent:#3b82f6; --text:#e2e8f0; --text-dim:#64748b;
  --green:#22c55e; --amber:#f59e0b; --red:#ef4444;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.header{
  background:linear-gradient(135deg,var(--surface) 0%,var(--surface2) 100%);
  border-bottom:1px solid var(--border);padding:18px 28px;
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;
}
.header-left{display:flex;align-items:center;gap:16px;}
.header-left img{height:38px;width:auto;}
.header h1{font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:700;color:var(--accent);letter-spacing:2px;}
.header .meta{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-dim);letter-spacing:1.5px;text-align:right;}
.container{max-width:1280px;margin:0 auto;padding:24px;}
.cards{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:26px;}
.card{flex:1;min-width:160px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px;}
.card .label{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1.5px;color:var(--text-dim);text-transform:uppercase;margin-bottom:8px;}
.card .value{font-family:'IBM Plex Mono',monospace;font-size:28px;font-weight:700;}
.card.c-green .value{color:var(--green);}
.card.c-red .value{color:var(--red);}
.card.c-amber .value{color:var(--amber);}
.card.c-blue .value{color:var(--accent);}
.card .sub{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text-dim);margin-top:4px;}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:22px;margin-bottom:24px;}
.panel-title{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.panel-title::before{content:'';width:4px;height:16px;background:var(--accent);border-radius:2px;}
table{width:100%;border-collapse:collapse;font-size:12px;}
th{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--text-dim);text-align:left;padding:9px 10px;border-bottom:1px solid var(--border);}
td{padding:9px 10px;border-bottom:1px solid var(--border);}
td.num{text-align:right;font-family:'IBM Plex Mono',monospace;}
tr:hover td{background:var(--surface2);}
.badge{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;padding:2px 7px;border-radius:4px;letter-spacing:0.5px;}
.b-ontime{background:rgba(34,197,94,0.18);color:#4ade80;}
.b-late{background:rgba(239,68,68,0.18);color:#f87171;}
.b-proc{background:rgba(245,158,11,0.18);color:#fbbf24;}
.b-out{background:rgba(168,85,247,0.2);color:#c084fc;}
tr.is-out td{background:rgba(168,85,247,0.07);}
.empty-msg{text-align:center;color:var(--text-dim);font-family:'IBM Plex Mono',monospace;padding:60px 20px;letter-spacing:1px;}
.filtros{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:24px;}
.filtro{flex:1;min-width:200px;}
.filtro label{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:2px;color:var(--text-dim);text-transform:uppercase;margin-bottom:6px;}
.filtro select{width:100%;padding:11px 14px;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:14px;cursor:pointer;}
.note{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text-dim);margin-top:10px;line-height:1.5;}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <img src="logo.png" alt="RUBIO">
    <h1>CUMPLIMIENTO DE ENTREGAS</h1>
  </div>
  <div class="meta"><div id="fechaGen"></div></div>
</div>

<div class="container" id="app"></div>

<script>
const UMBRAL_OUTLIER = 30; // días: retrasos mayores se excluyen del promedio

const p = new URLSearchParams(window.location.search);
const fechaGen = p.get('fecha') || '';
const hoyKey = p.get('hoy') || '';
document.getElementById('fechaGen').textContent = fechaGen ? ('GENERADO: ' + fechaGen) : '';

// datos: cli¦sede¦oc¦np¦fechaEntKey¦fechaEntTxt¦fechaEnvKey¦fechaEnvTxt¦enviado
function parseRows(raw){
  const out=[]; if(!raw) return out;
  const filas = raw.split('\u00A7');
  for(let i=0;i<filas.length;i++){ out.push(filas[i].split('\u00A6')); }
  return out;
}

// días entre dos claves yyyyMMdd (b - a)
function diasEntre(aKey, bKey){
  if(!aKey || !bKey || aKey.length!==8 || bKey.length!==8) return null;
  const da = new Date(+aKey.slice(0,4), +aKey.slice(4,6)-1, +aKey.slice(6,8));
  const db = new Date(+bKey.slice(0,4), +bKey.slice(4,6)-1, +bKey.slice(6,8));
  return Math.round((db - da) / 86400000);
}

const raw = parseRows(p.get('datos'));
const app = document.getElementById('app');

// Construir registros con retraso calculado
const regs = [];
for(const r of raw){
  const enviado = (r[8]||'') === 'Si';
  const fEntKey = r[4]||'';
  // fecha de comparación: si enviado usa fechaEnv; si no, usa hoy
  const refKey = enviado ? (r[6]||'') : hoyKey;
  const dias = diasEntre(fEntKey, refKey); // positivo = tarde, <=0 = a tiempo
  regs.push({
    cli: r[0]||'', sede: r[1]||'', oc: r[2]||'', np: r[3]||'',
    fEntTxt: r[5]||'', fEnvTxt: r[7]||'',
    enviado, dias,
    // sin fecha de entrega no se puede evaluar
    evaluable: dias !== null
  });
}

if(regs.length === 0){
  app.innerHTML = '<div class="empty-msg">No hay órdenes para analizar.</div>';
} else {
  buildDashboard(regs);
}

function buildDashboard(regs){
  const clientes = [...new Set(regs.map(r=>r.cli))].sort();

  app.innerHTML = `
    <div class="filtros">
      <div class="filtro">
        <label>Cliente</label>
        <select id="fCliente"><option value="">Todos los clientes</option>${clientes.map(c=>`<option>${c}</option>`).join('')}</select>
      </div>
      <div class="filtro">
        <label>Estatus</label>
        <select id="fEstatus">
          <option value="">Todos</option>
          <option value="tarde">Solo con retraso</option>
          <option value="ontime">Solo a tiempo</option>
        </select>
      </div>
    </div>
    <div class="cards" id="cards"></div>
    <div class="panel">
      <div class="panel-title">Detalle de Órdenes</div>
      <table>
        <thead><tr>
          <th>Cliente</th><th>Sede</th><th>OC / Línea</th><th>No. Parte</th>
          <th>F. Entrega</th><th>F. Envío</th><th style="text-align:right">Días</th><th>Estatus</th>
        </tr></thead>
        <tbody id="tabla"></tbody>
      </table>
      <div class="note" id="notaOutliers"></div>
    </div>
    <div class="panel">
      <div class="panel-title">Resumen por Cliente</div>
      <table>
        <thead><tr><th>Cliente</th><th style="text-align:right">Órdenes</th><th style="text-align:right">A tiempo</th><th style="text-align:right">Con retraso</th><th style="text-align:right">Prom. retraso (días)</th></tr></thead>
        <tbody id="tablaCli"></tbody>
      </table>
    </div>
  `;

  function filtrar(){
    const fc = document.getElementById('fCliente').value;
    const fe = document.getElementById('fEstatus').value;
    return regs.filter(r=>{
      if(fc && r.cli !== fc) return false;
      if(fe === 'tarde' && !(r.evaluable && r.dias > 0)) return false;
      if(fe === 'ontime' && !(r.evaluable && r.dias <= 0)) return false;
      return true;
    });
  }

  // promedio de retrasos excluyendo outliers > UMBRAL
  function promedioRetraso(arr){
    const tardes = arr.filter(r=>r.evaluable && r.dias > 0);
    const incluidos = tardes.filter(r=>r.dias <= UMBRAL_OUTLIER);
    const outliers = tardes.filter(r=>r.dias > UMBRAL_OUTLIER);
    let prom = 0;
    if(incluidos.length > 0){
      prom = incluidos.reduce((a,r)=>a+r.dias,0) / incluidos.length;
    }
    return { prom, nIncl: incluidos.length, outliers };
  }

  function render(){
    const f = filtrar();

    const aTiempo = f.filter(r=>r.evaluable && r.dias <= 0).length;
    const conRetraso = f.filter(r=>r.evaluable && r.dias > 0).length;
    const enProceso = f.filter(r=>!r.enviado).length;
    const { prom, nIncl, outliers } = promedioRetraso(f);
    const totalEval = aTiempo + conRetraso;
    const pctOntime = totalEval > 0 ? Math.round(aTiempo/totalEval*100) : 0;

    document.getElementById('cards').innerHTML = `
      <div class="card c-green"><div class="label">A Tiempo</div><div class="value">${aTiempo}</div><div class="sub">${pctOntime}% de ${totalEval}</div></div>
      <div class="card c-red"><div class="label">Con Retraso</div><div class="value">${conRetraso}</div></div>
      <div class="card c-amber"><div class="label">Prom. Retraso</div><div class="value">${prom.toFixed(1)}</div><div class="sub">días · ${nIncl} órdenes</div></div>
      <div class="card c-blue"><div class="label">En Proceso (tarde)</div><div class="value">${enProceso}</div></div>
    `;

    // tabla detalle (ordenada: más retraso arriba)
    const rows = [...f].sort((a,b)=>{
      const da = a.evaluable ? a.dias : -9999;
      const db = b.evaluable ? b.dias : -9999;
      return db - da;
    });
    document.getElementById('tabla').innerHTML = rows.map(r=>{
      let badge, outClass = '';
      if(!r.evaluable){ badge = '<span class="badge">Sin fecha</span>'; }
      else if(r.dias > 0){
        if(r.dias > UMBRAL_OUTLIER){ badge = '<span class="badge b-out">EXCLUIDO ('+r.dias+'d)</span>'; outClass='is-out'; }
        else { badge = '<span class="badge b-late">Retraso</span>'; }
        if(!r.enviado) badge += ' <span class="badge b-proc">En proceso</span>';
      } else {
        badge = '<span class="badge b-ontime">A tiempo</span>';
      }
      const diasTxt = r.evaluable ? (r.dias > 0 ? '+'+r.dias : r.dias) : '—';
      return `<tr class="${outClass}">
        <td>${r.cli}</td><td>${r.sede}</td><td>${r.oc}</td><td>${r.np}</td>
        <td>${r.fEntTxt}</td><td>${r.fEnvTxt}</td>
        <td class="num">${diasTxt}</td><td>${badge}</td>
      </tr>`;
    }).join('');

    // nota de outliers
    if(outliers.length > 0){
      const lista = outliers.map(o=>`${o.oc} (${o.cli}, ${o.dias}d)`).join(' · ');
      document.getElementById('notaOutliers').innerHTML =
        `⚠ Excluidos del promedio por superar ${UMBRAL_OUTLIER} días de retraso: ${lista}`;
    } else {
      document.getElementById('notaOutliers').innerHTML =
        `Promedio calculado sobre retrasos de hasta ${UMBRAL_OUTLIER} días.`;
    }

    // resumen por cliente
    const porCli = {};
    f.forEach(r=>{
      if(!porCli[r.cli]) porCli[r.cli] = {tot:0, ont:0, tar:0, suma:0, nIncl:0};
      const o = porCli[r.cli];
      o.tot++;
      if(r.evaluable){
        if(r.dias <= 0) o.ont++;
        else { o.tar++; if(r.dias <= UMBRAL_OUTLIER){ o.suma += r.dias; o.nIncl++; } }
      }
    });
    const cliRows = Object.keys(porCli).sort((a,b)=>porCli[b].tar-porCli[a].tar);
    document.getElementById('tablaCli').innerHTML = cliRows.map(cl=>{
      const o = porCli[cl];
      const promCli = o.nIncl > 0 ? (o.suma/o.nIncl).toFixed(1) : '—';
      return `<tr><td>${cl}</td><td class="num">${o.tot}</td><td class="num">${o.ont}</td><td class="num">${o.tar}</td><td class="num">${promCli}</td></tr>`;
    }).join('');
  }

  document.getElementById('fCliente').addEventListener('change', render);
  document.getElementById('fEstatus').addEventListener('change', render);
  render();
}
</script>

</body>
</html>
