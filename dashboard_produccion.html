<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Producción</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap');

        :root {
            --bg: #0c0f14;
            --surface: #141820;
            --surface2: #1a2030;
            --border: #2a3348;
            --accent: #3b82f6;
            --accent2: #f59e0b;
            --danger: #ef4444;
            --text: #e2e8f0;
            --text-dim: #64748b;
            --green: #22c55e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .topbar {
            background: linear-gradient(135deg, var(--surface) 0%, var(--surface2) 100%);
            border-bottom: 1px solid var(--border);
            padding: 18px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .topbar h1 {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 17px; font-weight: 700;
            color: var(--accent); letter-spacing: 1.5px;
        }
        .topbar .periodo {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
            color: var(--text-dim);
            letter-spacing: 1px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 28px;
        }

        /* Filtros */
        .filtros {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }
        .filtro-group {
            flex: 1;
            min-width: 200px;
        }
        .filtro-group label {
            display: block;
            font-size: 11px;
            font-family: 'IBM Plex Mono', monospace;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }
        .filtro-group select {
            width: 100%;
            padding: 10px 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            cursor: pointer;
        }
        .filtro-group select:focus {
            outline: none;
            border-color: var(--accent);
        }

        /* Tarjetas resumen */
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }
        .card .card-label {
            font-size: 11px;
            font-family: 'IBM Plex Mono', monospace;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .card .card-value {
            font-size: 32px;
            font-weight: 700;
            font-family: 'IBM Plex Mono', monospace;
        }
        .card .card-sub {
            font-size: 12px;
            color: var(--text-dim);
            margin-top: 4px;
        }
        .card.enviadas .card-value { color: var(--accent); }
        .card.desperdicio .card-value { color: var(--danger); }
        .card.areas .card-value { color: var(--green); }
        .card.tasa .card-value { color: var(--accent2); }

        /* Secciones de gráficas */
        .chart-section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 22px;
            margin-bottom: 24px;
        }
        .chart-section h2 {
            font-size: 14px;
            font-family: 'IBM Plex Mono', monospace;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text);
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .chart-section h2::before {
            content: '';
            width: 3px;
            height: 16px;
            background: var(--accent);
            border-radius: 2px;
        }
        .chart-wrap {
            position: relative;
            height: 380px;
        }
        .chart-wrap.tall { height: 480px; }

        .empty-msg {
            text-align: center;
            color: var(--text-dim);
            padding: 60px 20px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 14px;
        }

        /* Tabla detalle */
        .tabla-detalle {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .tabla-detalle th {
            text-align: left;
            padding: 10px 12px;
            border-bottom: 2px solid var(--border);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-dim);
        }
        .tabla-detalle td {
            padding: 9px 12px;
            border-bottom: 1px solid var(--border);
        }
        .tabla-detalle td.num {
            text-align: right;
            font-family: 'IBM Plex Mono', monospace;
        }
        .tabla-detalle tr:hover td { background: var(--surface2); }
        .tabla-detalle .desp-val { color: var(--danger); }
    </style>
</head>
<body>

    <div class="topbar">
        <h1>DASHBOARD DE PRODUCCIÓN</h1>
        <div class="periodo" id="periodoLabel">—</div>
    </div>

    <div class="container">
        <div class="filtros">
            <div class="filtro-group">
                <label>Cliente</label>
                <select id="filtroCliente"><option value="">Todos los clientes</option></select>
            </div>
            <div class="filtro-group">
                <label>Sede</label>
                <select id="filtroSede"><option value="">Todas las sedes</option></select>
            </div>
        </div>

        <div class="cards">
            <div class="card enviadas">
                <div class="card-label">Piezas Enviadas</div>
                <div class="card-value" id="totalEnviadas">0</div>
            </div>
            <div class="card desperdicio">
                <div class="card-label">Desperdicio Total</div>
                <div class="card-value" id="totalDesperdicio">0</div>
            </div>
            <div class="card tasa">
                <div class="card-label">Tasa Desperdicio</div>
                <div class="card-value" id="tasaDesperdicio">0%</div>
            </div>
            <div class="card areas">
                <div class="card-label">Áreas Activas</div>
                <div class="card-value" id="totalAreas">0</div>
            </div>
        </div>

        <div class="chart-section">
            <h2>Piezas y Desperdicio por Área</h2>
            <div class="chart-wrap tall" id="wrapArea">
                <canvas id="chartArea"></canvas>
            </div>
        </div>

        <div class="chart-section">
            <h2>Piezas Enviadas por Cliente</h2>
            <div class="chart-wrap" id="wrapCliente">
                <canvas id="chartCliente"></canvas>
            </div>
        </div>

        <div class="chart-section">
            <h2>Piezas Enviadas por Sede</h2>
            <div class="chart-wrap" id="wrapSede">
                <canvas id="chartSede"></canvas>
            </div>
        </div>

        <div class="chart-section">
            <h2>Detalle Área · Cliente · Sede</h2>
            <table class="tabla-detalle">
                <thead>
                    <tr>
                        <th>Área</th>
                        <th>Cliente</th>
                        <th>Sede</th>
                        <th style="text-align:right;">Enviadas</th>
                        <th style="text-align:right;">Desperdicio</th>
                    </tr>
                </thead>
                <tbody id="tablaBody"></tbody>
            </table>
        </div>
    </div>

<script>
    // ══════════════════════════════════════════════════════════
    //  LEER DATOS
    // ══════════════════════════════════════════════════════════
    const params = new URLSearchParams(window.location.search);
    const periodo = params.get('periodo') || '';
    document.getElementById('periodoLabel').textContent = periodo;

    let datos = [];
    const datosParam = params.get('datos');
    if (datosParam) {
        try {
            datos = JSON.parse(decodeURIComponent(datosParam));
        } catch(e) {
            console.error('Error parsing datos:', e);
        }
    }

    // Paleta para gráficas
    const COLORS = ['#3b82f6','#f59e0b','#22c55e','#ef4444','#a855f7','#06b6d4','#ec4899','#84cc16','#f97316','#14b8a6','#6366f1','#eab308'];

    // Poblar filtros
    const clientes = [...new Set(datos.map(d => d.cl).filter(Boolean))].sort();
    const sedes = [...new Set(datos.map(d => d.sd).filter(Boolean))].sort();
    const selCli = document.getElementById('filtroCliente');
    const selSede = document.getElementById('filtroSede');
    clientes.forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = c; selCli.appendChild(o); });
    sedes.forEach(s => { const o = document.createElement('option'); o.value = s; o.textContent = s; selSede.appendChild(o); });

    let chartArea = null, chartCliente = null, chartSede = null;

    function agrupar(arr, key) {
        const map = {};
        arr.forEach(d => {
            const k = d[key] || '(Sin dato)';
            if (!map[k]) map[k] = { env: 0, desp: 0 };
            map[k].env += parseFloat(d.env) || 0;
            map[k].desp += parseFloat(d.desp) || 0;
        });
        return map;
    }

    function render() {
        const cliSel = selCli.value;
        const sedeSel = selSede.value;
        const filtrado = datos.filter(d =>
            (cliSel === '' || d.cl === cliSel) &&
            (sedeSel === '' || d.sd === sedeSel)
        );

        // Tarjetas
        const totEnv = filtrado.reduce((s, d) => s + (parseFloat(d.env) || 0), 0);
        const totDesp = filtrado.reduce((s, d) => s + (parseFloat(d.desp) || 0), 0);
        const areasAct = new Set(filtrado.filter(d => (parseFloat(d.env) || 0) > 0).map(d => d.a)).size;
        const tasa = totEnv > 0 ? ((totDesp / totEnv) * 100).toFixed(1) : 0;
        document.getElementById('totalEnviadas').textContent = totEnv.toLocaleString('es-MX');
        document.getElementById('totalDesperdicio').textContent = totDesp.toLocaleString('es-MX');
        document.getElementById('tasaDesperdicio').textContent = tasa + '%';
        document.getElementById('totalAreas').textContent = areasAct;

        // ── Gráfica por área (barras enviado + desperdicio) ──
        const porArea = agrupar(filtrado, 'a');
        const areasLabels = Object.keys(porArea).sort((a, b) => porArea[b].env - porArea[a].env);
        if (chartArea) chartArea.destroy();
        chartArea = new Chart(document.getElementById('chartArea'), {
            type: 'bar',
            data: {
                labels: areasLabels,
                datasets: [
                    { label: 'Enviadas', data: areasLabels.map(a => porArea[a].env), backgroundColor: '#3b82f6', borderRadius: 4 },
                    { label: 'Desperdicio', data: areasLabels.map(a => porArea[a].desp), backgroundColor: '#ef4444', borderRadius: 4 }
                ]
            },
            options: chartOpts(true)
        });

        // ── Gráfica por cliente (dona) ──
        const porCli = agrupar(filtrado, 'cl');
        const cliLabels = Object.keys(porCli).sort((a, b) => porCli[b].env - porCli[a].env);
        if (chartCliente) chartCliente.destroy();
        chartCliente = new Chart(document.getElementById('chartCliente'), {
            type: 'doughnut',
            data: {
                labels: cliLabels,
                datasets: [{ data: cliLabels.map(c => porCli[c].env), backgroundColor: COLORS, borderColor: '#141820', borderWidth: 2 }]
            },
            options: donutOpts()
        });

        // ── Gráfica por sede (dona) ──
        const porSede = agrupar(filtrado, 'sd');
        const sedeLabels = Object.keys(porSede).sort((a, b) => porSede[b].env - porSede[a].env);
        if (chartSede) chartSede.destroy();
        chartSede = new Chart(document.getElementById('chartSede'), {
            type: 'doughnut',
            data: {
                labels: sedeLabels,
                datasets: [{ data: sedeLabels.map(s => porSede[s].env), backgroundColor: COLORS, borderColor: '#141820', borderWidth: 2 }]
            },
            options: donutOpts()
        });

        // ── Tabla detalle ──
        const tbody = document.getElementById('tablaBody');
        tbody.innerHTML = '';
        const ordenado = [...filtrado].sort((a, b) => (parseFloat(b.env) || 0) - (parseFloat(a.env) || 0));
        ordenado.forEach(d => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${d.a || ''}</td>
                <td>${d.cl || ''}</td>
                <td>${d.sd || ''}</td>
                <td class="num">${(parseFloat(d.env) || 0).toLocaleString('es-MX')}</td>
                <td class="num desp-val">${(parseFloat(d.desp) || 0).toLocaleString('es-MX')}</td>
            `;
            tbody.appendChild(tr);
        });
        if (ordenado.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:var(--text-dim); padding:30px;">Sin datos para este filtro</td></tr>';
        }
    }

    function chartOpts(stacked) {
        return {
            responsive: true,
            maintainAspectRatio: false,
            indexAxis: 'y',
            scales: {
                x: { ticks: { color: '#64748b' }, grid: { color: '#2a3348' } },
                y: { ticks: { color: '#e2e8f0', font: { size: 11 } }, grid: { display: false } }
            },
            plugins: {
                legend: { labels: { color: '#e2e8f0', font: { family: 'DM Sans' } } }
            }
        };
    }

    function donutOpts() {
        return {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { position: 'right', labels: { color: '#e2e8f0', font: { family: 'DM Sans', size: 12 }, padding: 12 } }
            }
        };
    }

    selCli.addEventListener('change', render);
    selSede.addEventListener('change', render);

    if (datos.length > 0) {
        render();
    } else {
        document.querySelector('.container').innerHTML = '<div class="empty-msg">No hay datos para el período seleccionado.</div>';
    }
</script>

</body>
</html>
