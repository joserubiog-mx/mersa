<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Salidas de inventario SH · MERSA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --steel: #E9EDF1;
    --panel: #FFFFFF;
    --navy: #1F2A44;
    --ink: #26303D;
    --muted: #677384;
    --rule: #D3DAE2;
    --track: #EEF1F5;
    --hiviz: #F2A900;
    --hiviz-ink: #7A5500;
    --bar: #3D4E6E;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; }
  body {
    background: var(--steel);
    color: var(--ink);
    font-family: "Barlow", "Segoe UI", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.45;
  }

  header {
    background: var(--navy);
    color: #fff;
    border-bottom: 6px solid var(--hiviz);
  }
  .head-inner {
    max-width: 1280px;
    margin: 0 auto;
    padding: 20px 24px;
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
  }
  .logo {
    height: 44px;
    background: #fff;
    padding: 6px 10px;
    border-radius: 4px;
  }
  .title-block { flex: 1 1 280px; }
  h1 {
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-weight: 700;
    font-size: 30px;
    line-height: 1.1;
    margin: 0;
    letter-spacing: 0.01em;
  }
  .period { margin: 4px 0 0; color: #C3CBD8; font-size: 15px; }

  .toggle {
    display: inline-flex;
    border: 1px solid #56627C;
    border-radius: 6px;
    overflow: hidden;
  }
  .toggle button {
    font: 600 15px "Barlow", sans-serif;
    background: transparent;
    color: #C3CBD8;
    border: 0;
    padding: 9px 16px;
    cursor: pointer;
  }
  .toggle button[aria-pressed="true"] { background: var(--hiviz); color: var(--navy); }
  .toggle button:focus-visible { outline: 3px solid #fff; outline-offset: -3px; }

  .totals {
    max-width: 1280px;
    margin: 0 auto;
    padding: 20px 24px 0;
    display: flex;
    gap: 36px;
    flex-wrap: wrap;
    color: var(--muted);
  }
  .totals strong {
    display: block;
    font-family: "Barlow Condensed", sans-serif;
    font-size: 28px;
    color: var(--navy);
    line-height: 1;
  }

  main {
    max-width: 1280px;
    margin: 0 auto;
    padding: 20px 24px 40px;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 20px;
  }
  @media (max-width: 1024px) { main { grid-template-columns: 1fr; } }

  section {
    background: var(--panel);
    border-top: 4px solid var(--navy);
    border-radius: 2px 2px 6px 6px;
    padding: 20px 22px 22px;
    min-width: 0;
  }
  h2 {
    font-family: "Barlow Condensed", sans-serif;
    font-weight: 600;
    font-size: 22px;
    margin: 0 0 14px;
    color: var(--navy);
  }

  .leader {
    border-left: 6px solid var(--hiviz);
    background: #FFF8E6;
    padding: 12px 14px;
    margin-bottom: 18px;
  }
  .leader-name {
    font-family: "Barlow Condensed", sans-serif;
    font-weight: 700;
    font-size: 26px;
    line-height: 1.1;
    color: var(--navy);
    overflow-wrap: anywhere;
  }
  .leader-val { color: var(--hiviz-ink); font-weight: 600; margin-top: 4px; }

  ol { list-style: none; margin: 0; padding: 0; }
  li {
    display: grid;
    grid-template-columns: 26px minmax(0, 1fr) auto;
    column-gap: 10px;
    align-items: center;
    padding: 7px 0;
    border-bottom: 1px solid var(--track);
  }
  li:last-child { border-bottom: 0; }
  .pos {
    font-family: "Barlow Condensed", sans-serif;
    font-weight: 600;
    color: var(--muted);
    text-align: right;
  }
  .name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .val { font-family: "Barlow Condensed", sans-serif; font-weight: 600; font-size: 18px; color: var(--navy); }
  .track {
    grid-column: 2 / 4;
    height: 8px;
    background: var(--track);
    border-radius: 4px;
    margin-top: 5px;
    overflow: hidden;
  }
  .fill { height: 100%; background: var(--bar); border-radius: 4px; transition: width .5s ease; }
  li:first-child .fill { background: var(--hiviz); }
  @media (prefers-reduced-motion: reduce) { .fill { transition: none; } }

  .empty { color: var(--muted); margin: 8px 0 0; }

  .notice {
    max-width: 640px;
    margin: 48px auto;
    background: var(--panel);
    border-top: 4px solid var(--hiviz);
    padding: 24px 28px;
    border-radius: 2px 2px 6px 6px;
  }
  .notice h2 { margin-bottom: 8px; }
  .notice a { color: var(--bar); font-weight: 600; }

  footer { text-align: center; color: var(--muted); font-size: 14px; padding: 0 24px 28px; }

  @media print {
    body { background: #fff; }
    .toggle { display: none; }
    section { break-inside: avoid; border: 1px solid var(--rule); }
    main { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="head-inner">
    <img class="logo" src="logo.png" alt="MERSA" onerror="this.style.display='none'">
    <div class="title-block">
      <h1>Salidas de inventario SH</h1>
      <p class="period" id="period">Todo el historial</p>
    </div>
    <div class="toggle" role="group" aria-label="Medir por">
      <button type="button" data-metric="piezas" aria-pressed="true">Piezas entregadas</button>
      <button type="button" data-metric="solicitudes" aria-pressed="false">Número de solicitudes</button>
    </div>
  </div>
</header>

<div id="app"></div>

<footer>Maquinados Especiales Rubio · Generado <span id="generated"></span></footer>

<script>
(function () {
  const params = new URLSearchParams(window.location.search);
  const app = document.getElementById('app');
  let metric = 'piezas';

  document.getElementById('generated').textContent =
    new Date().toLocaleString('es-MX', { dateStyle: 'medium', timeStyle: 'short' });

  // Formato por registro: nombre;;piezas;;solicitudes  | registros separados por ~~
  function parse(raw) {
    if (!raw) return [];
    return raw.split('~~').map(function (row) {
      const parts = row.split(';;');
      return {
        nombre: (parts[0] || '').trim() || 'Sin dato',
        piezas: parseFloat(parts[1]) || 0,
        solicitudes: parseInt(parts[2], 10) || 0
      };
    }).filter(function (r) { return r.piezas > 0 || r.solicitudes > 0; });
  }

  let data;
  if (params.get('demo') === '1') {
    data = {
      productos: parse('Guantes de nitrilo;;340;;52~~Lentes de seguridad;;128;;60~~Tapones auditivos;;500;;41~~Cubrebocas KN95;;260;;33~~Guantes anticorte;;96;;38~~Careta para esmerilar;;22;;19~~Botas de seguridad;;18;;18~~Mangas anticorte;;40;;12~~Chaleco reflejante;;15;;11~~Mandil de carnaza;;9;;8~~Casco;;7;;7'),
      personas: parse('Juan Pérez;;120;;22~~María López;;98;;18~~Carlos Ruiz;;85;;25~~Ana Torres;;70;;12~~Luis Gómez;;64;;15~~Pedro Sánchez;;40;;9~~Rosa Díaz;;38;;11~~Jorge Ramírez;;30;;7~~Elena Cruz;;22;;6~~Miguel Flores;;15;;4'),
      motivos: parse('Desgaste;;620;;110~~Ingreso de personal;;210;;35~~Extravío;;140;;40~~Daño en operación;;160;;28~~Cambio de área;;50;;9')
    };
  } else {
    data = {
      productos: parse(params.get('p')),
      personas: parse(params.get('s')),
      motivos: parse(params.get('m'))
    };
  }

  const desde = params.get('desde');
  const hasta = params.get('hasta');
  if (desde || hasta) {
    document.getElementById('period').textContent =
      desde && hasta ? 'Del ' + desde + ' al ' + hasta :
      desde ? 'Desde el ' + desde : 'Hasta el ' + hasta;
  }

  const hasData = data.productos.length || data.personas.length || data.motivos.length;

  if (!hasData) {
    app.innerHTML =
      '<div class="notice"><h2>No hay salidas para mostrar</h2>' +
      '<p>Abre este dashboard desde Zoho Creator con el formulario <b>Consultar Dashboard</b>. ' +
      'Si ya lo hiciste, el periodo elegido no tiene salidas registradas: prueba con otras fechas o déjalas en blanco.</p>' +
      '<p><a href="?demo=1">Ver con datos de ejemplo</a></p></div>';
    return;
  }

  app.innerHTML =
    '<div class="totals" id="totals"></div>' +
    '<main>' +
      panel('productos', 'Productos con más salidas') +
      panel('personas', 'Personas que más solicitan') +
      panel('motivos', 'Motivos de solicitud') +
    '</main>';

  function panel(id, title) {
    return '<section aria-labelledby="h-' + id + '"><h2 id="h-' + id + '">' + title + '</h2>' +
           '<div id="' + id + '"></div></section>';
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function fmt(n) { return Number(n).toLocaleString('es-MX'); }

  function unit(n) {
    if (metric === 'piezas') return n === 1 ? 'pieza' : 'piezas';
    return n === 1 ? 'solicitud' : 'solicitudes';
  }

  function render(id) {
    const el = document.getElementById(id);
    const top = data[id].slice().sort(function (a, b) {
      return b[metric] - a[metric] || a.nombre.localeCompare(b.nombre, 'es');
    }).slice(0, 10);

    if (!top.length) { el.innerHTML = '<p class="empty">Sin registros en este periodo.</p>'; return; }

    const max = top[0][metric] || 1;
    const lead = top[0];
    let html =
      '<div class="leader"><div class="leader-name">' + esc(lead.nombre) + '</div>' +
      '<div class="leader-val">' + fmt(lead[metric]) + ' ' + unit(lead[metric]) + '</div></div><ol>';

    top.forEach(function (r, i) {
      const pct = Math.max(2, (r[metric] / max) * 100);
      html += '<li><span class="pos">' + (i + 1) + '</span>' +
              '<span class="name" title="' + esc(r.nombre) + '">' + esc(r.nombre) + '</span>' +
              '<span class="val">' + fmt(r[metric]) + '</span>' +
              '<div class="track" aria-hidden="true"><div class="fill" style="width:0"></div></div></li>';
    });
    html += '</ol>';
    el.innerHTML = html;

    requestAnimationFrame(function () {
      el.querySelectorAll('.fill').forEach(function (f, i) {
        f.style.width = Math.max(2, (top[i][metric] / max) * 100) + '%';
      });
    });
  }

  function renderTotals() {
    const piezas = data.productos.reduce(function (s, r) { return s + r.piezas; }, 0);
    const sols = data.productos.reduce(function (s, r) { return s + r.solicitudes; }, 0);
    document.getElementById('totals').innerHTML =
      '<div><strong>' + fmt(piezas) + '</strong>piezas entregadas</div>' +
      '<div><strong>' + fmt(sols) + '</strong>solicitudes</div>' +
      '<div><strong>' + fmt(data.productos.length) + '</strong>productos distintos</div>' +
      '<div><strong>' + fmt(data.personas.length) + '</strong>personas</div>';
  }

  function renderAll() { ['productos', 'personas', 'motivos'].forEach(render); }

  document.querySelectorAll('.toggle button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      metric = btn.dataset.metric;
      document.querySelectorAll('.toggle button').forEach(function (b) {
        b.setAttribute('aria-pressed', b === btn ? 'true' : 'false');
      });
      renderAll();
    });
  });

  renderTotals();
  renderAll();
})();
</script>
</body>
</html>
