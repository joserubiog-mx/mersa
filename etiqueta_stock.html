<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etiqueta de Stock</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=DM+Sans:wght@400;500;700&family=Roboto:wght@400;500;700;900&display=swap');

        :root {
            --bg: #0c0f14;
            --surface: #141820;
            --surface2: #1a2030;
            --border: #2a3348;
            --amber: #3b82f6;
            --green: #34d399;
            --red: #f87171;
            --text: #e2e8f0;
            --text-dim: #64748b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg); color: var(--text);
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
        }

        .header {
            width: 100%;
            background: linear-gradient(135deg, var(--surface) 0%, var(--surface2) 100%);
            border-bottom: 1px solid var(--border);
            padding: 14px 24px;
            display: flex; align-items: center; gap: 14px;
        }
        .header-text h1 {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 15px; font-weight: 700;
            color: var(--amber); letter-spacing: 1.5px;
        }
        .header-text span {
            font-size: 11px; color: var(--text-dim);
            font-family: 'IBM Plex Mono', monospace; letter-spacing: 2px;
        }

        .container { width: 100%; max-width: 620px; padding: 24px 20px; }

        .printer-status {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 8px; padding: 14px 18px; margin-bottom: 20px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .printer-status .left { display: flex; align-items: center; gap: 10px; }
        .status-dot {
            width: 10px; height: 10px; border-radius: 50%;
            background: var(--text-dim); flex-shrink: 0; transition: background 0.3s;
        }
        .status-dot.connected { background: var(--green); box-shadow: 0 0 8px rgba(52,211,153,0.4); }
        .status-dot.error { background: var(--red); box-shadow: 0 0 8px rgba(248,113,113,0.4); }
        .status-dot.searching { background: var(--amber); animation: pulse 1.2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .status-label { font-size: 13px; font-weight: 500; }
        .printer-name { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-dim); }
        .btn-retry {
            background: transparent; border: 1px solid var(--border);
            color: var(--amber); font-size: 11px; padding: 5px 12px;
            border-radius: 4px; cursor: pointer;
            font-family: 'IBM Plex Mono', monospace;
        }

        .label-item {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 8px; padding: 16px; margin-bottom: 20px;
        }
        .label-item-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border);
        }
        .label-item-header .tag {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px; font-weight: 700; color: var(--green);
        }
        .label-item-header .np {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px; color: var(--text-dim);
        }

        .label-preview-wrapper { display: flex; justify-content: center; }

        .label-card {
            background: #fff; color: #000;
            border: 1.5px dashed #888; border-radius: 3px;
            width: 480px; height: 240px;
            font-family: 'Roboto', sans-serif;
            font-size: 12px; position: relative; overflow: hidden;
            padding: 10px 14px;
        }
        .label-card .data-zone {
            color: #000;
        }
        .label-card .data-text div {
            font-weight: 700; letter-spacing: 0.3px;
        }
        .label-card .stock-badge {
            display: inline-block; background: #000; color: #fff;
            padding: 3px 12px; border-radius: 3px; font-size: 12px;
            font-weight: 900; letter-spacing: 2px;
        }
        .label-card .bottom-zone {
            font-family: 'Roboto', sans-serif;
            font-size: 10px; color: #666;
            position: absolute; bottom: 8px; left: 14px;
        }

        .label-size {
            text-align: center; font-size: 10px; color: var(--text-dim);
            font-family: 'IBM Plex Mono', monospace; margin-top: 6px;
        }

        .fields-grid {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 6px; margin-top: 10px;
        }
        .field-item {
            background: var(--bg); border: 1px solid #1e2738;
            border-radius: 4px; padding: 6px 10px;
        }
        .field-item label {
            font-size: 9px; color: var(--text-dim);
            font-family: 'IBM Plex Mono', monospace; display: block;
        }
        .field-item .value { font-size: 12px; font-weight: 600; color: var(--text); }

        .copies-control {
            display: flex; align-items: center; gap: 12px; margin-bottom: 20px;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 8px; padding: 12px 16px;
        }
        .copies-control label {
            font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-dim);
        }
        .copies-control input {
            width: 60px; background: var(--bg); border: 1px solid var(--border);
            border-radius: 4px; padding: 6px 10px; color: var(--text);
            font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 600; text-align: center;
        }

        .print-btn {
            width: 100%; padding: 14px; font-size: 15px; font-weight: 700;
            font-family: 'IBM Plex Mono', monospace; letter-spacing: 1px;
            border: none; border-radius: 8px; cursor: pointer; transition: all 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .print-btn.ready { background: linear-gradient(135deg, #22c55e, #16a34a); color: #fff; }
        .print-btn.ready:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(34,197,94,0.3); }
        .print-btn.disabled { background: var(--surface2); color: var(--text-dim); cursor: not-allowed; border: 1px solid var(--border); }
        .print-btn.success { background: #065f46; color: var(--green); border: 1px solid #10b981; }
        .print-btn.error { background: #7f1d1d; color: var(--red); border: 1px solid #ef4444; }

        .message {
            margin-top: 12px; padding: 12px 16px; border-radius: 6px;
            font-size: 12px; font-family: 'IBM Plex Mono', monospace; line-height: 1.5;
        }
        .message.success { background: #052e16; border: 1px solid #166534; color: var(--green); }
        .message.error { background: #2a0a0a; border: 1px solid #7f1d1d; color: var(--red); }

        .debug-panel {
            margin-top: 20px; background: var(--surface);
            border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
        }
        .debug-toggle {
            width: 100%; background: none; border: none; color: var(--text-dim);
            font-family: 'IBM Plex Mono', monospace; font-size: 11px;
            padding: 10px 16px; cursor: pointer; text-align: left;
        }
        .debug-content {
            display: none; padding: 0 16px 14px;
            font-family: 'IBM Plex Mono', monospace; font-size: 11px;
            color: var(--text-dim); max-height: 200px; overflow-y: auto;
        }
        .debug-content.open { display: block; }
        .debug-content .log-line { padding: 2px 0; border-bottom: 1px solid #1a2030; }
        .debug-content .log-ok { color: var(--green); }
        .debug-content .log-err { color: var(--red); }
    </style>
</head>
<body>

    <div class="header">
        <div style="display:flex;align-items:center;gap:14px;">
            <img src="logo.png" alt="RUBIO" style="height:36px;">
            <div class="header-text">
                <h1>ETIQUETA DE STOCK</h1>
                <span>ZEBRA BROWSER PRINT · 4×2 PULGADAS</span>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="printer-status">
            <div class="left">
                <div class="status-dot searching" id="statusDot"></div>
                <div>
                    <div class="status-label" id="statusLabel">Buscando impresora...</div>
                    <div class="printer-name" id="printerName">—</div>
                </div>
            </div>
            <button class="btn-retry" onclick="findPrinter()">Reintentar</button>
        </div>

        <div id="labelContent"></div>

        <div class="copies-control">
            <label>COPIAS:</label>
            <input type="number" id="copies" value="1" min="1" max="50">
        </div>

        <button class="print-btn disabled" id="printBtn" onclick="printLabel()" disabled>
            BUSCANDO IMPRESORA...
        </button>

        <div id="messageArea"></div>

        <div class="debug-panel">
            <button class="debug-toggle" onclick="document.getElementById('debugContent').classList.toggle('open')">▸ Diagnóstico</button>
            <div class="debug-content" id="debugContent"></div>
        </div>
    </div>

<script>
    const BP_BASE = "https://localhost:9101";
    let selectedDevice = null;

    const p = new URLSearchParams(window.location.search);
    const data = {
        np: p.get('np') || '',
        rev: p.get('rev') || '',
        stock: p.get('stock') || '0',
        ubicacion: p.get('ubicacion') || '',
        cliente: p.get('cliente') || '',
        sede: p.get('sede') || '',
        fecha: p.get('fecha') || '',
        operador: p.get('operador') || '',
        acabado: p.get('acabado') || '',
    };

    // ══════════════════════════════════════════════════════════
    //  RENDER
    // ══════════════════════════════════════════════════════════

    document.getElementById('labelContent').innerHTML = `
        <div class="label-item">
            <div class="label-item-header">
                <span class="tag">STOCK · ${data.np}</span>
                <span class="np">REV ${data.rev} · ${data.cliente}</span>
            </div>
            <div class="label-preview-wrapper">
                <div>
                    <div class="label-card">
                        <div class="data-zone">
                            <div style="display:flex;justify-content:space-between;align-items:flex-start;">
                                <div>
                                    <div class="stock-badge">STOCK</div>
                                    <span style="font-size:18px;font-weight:900;margin-left:10px;">${data.np}</span>
                                    <span style="font-size:14px;font-weight:700;margin-left:6px;">REV ${data.rev}</span>
                                </div>
                                <div style="width:60px;height:60px;border:1.5px solid #000;border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:8px;color:#555;flex-direction:column;">
                                    <div style="font-size:16px;color:#000;">⬡</div>QR
                                </div>
                            </div>
                            <hr style="border:none;border-top:1.5px solid #000;margin:8px 0;">
                            <div style="display:flex;justify-content:space-between;align-items:baseline;">
                                <div class="data-text" style="font-size:24px;font-weight:900;">${data.stock} pzas</div>
                                <div class="data-text" style="font-size:15px;">Ubicación: ${data.ubicacion}</div>
                            </div>
                            <hr style="border:none;border-top:1.5px solid #000;margin:8px 0;">
                            <div style="display:flex;justify-content:space-between;">
                                <div>
                                    <span style="font-size:14px;font-weight:700;">${data.cliente}</span>
                                    <span style="font-size:13px;font-weight:600;margin-left:10px;">${data.sede}</span>
                                </div>
                                <div style="font-size:13px;font-weight:600;">${data.acabado || ''}</div>
                            </div>
                        </div>
                        <div class="bottom-zone" style="display:flex;justify-content:space-between;">${data.fecha}<span>Operador: ${data.operador}</span></div>
                    </div>
                    <div class="label-size">4 × 2 pulgadas</div>
                </div>
            </div>
            <div class="fields-grid">
                <div class="field-item"><label>Número de Parte</label><div class="value">${data.np}</div></div>
                <div class="field-item"><label>Revisión</label><div class="value">${data.rev}</div></div>
                <div class="field-item"><label>Stock</label><div class="value" style="color:#22c55e;">${data.stock} pzas</div></div>
                <div class="field-item"><label>Ubicación</label><div class="value">${data.ubicacion}</div></div>
                <div class="field-item"><label>Cliente</label><div class="value">${data.cliente}</div></div>
                <div class="field-item"><label>Sede</label><div class="value">${data.sede}</div></div>
                <div class="field-item"><label>Operador</label><div class="value">${data.operador}</div></div>
            </div>
        </div>
    `;

    // ══════════════════════════════════════════════════════════
    //  ZPL
    // ══════════════════════════════════════════════════════════

    function generateZPL() {
        return `^XA
^CI28
^PW812
^LL406
^LH0,0

^FO10,10^GB120,40,40^FS
^CF0,30,30
^FO25,18^FR^FDSTOCK^FS

^CF0,44,44
^FO150,10^FD${data.np}^FS
^CF0,36,36
^FO150,58^FDREV ${data.rev}^FS

^FO10,110^GB792,3,3^FS

^CF0,60,60
^FO15,130^FD${data.stock} pzas^FS

^CF0,40,40
^FO420,130^FDUbicacion: ${data.ubicacion}^FS

^FO10,210^GB792,3,3^FS

^CF0,36,36
^FO15,230^FD${data.cliente}^FS
^FO15,275^FD${data.sede}^FS

^CF0,36,36
^FO420,230^FDAcabado: ${data.acabado || ''}^FS

^CF0,28,28
^FO15,330^FD${data.fecha}^FS
^FO420,330^FDOperador: ${data.operador}^FS

^FO550,10^BQN,2,5^FDMA,${data.np}-${data.rev}^FS
^XZ`;
    }

    // ══════════════════════════════════════════════════════════
    //  IMPRIMIR
    // ══════════════════════════════════════════════════════════

    async function printLabel() {
        if (!selectedDevice) return;

        const btn = document.getElementById('printBtn');
        const copies = parseInt(document.getElementById('copies').value) || 1;

        let zpl = '';
        for (let i = 0; i < copies; i++) {
            zpl += generateZPL() + '\n';
        }

        btn.className = 'print-btn disabled';
        btn.textContent = 'ENVIANDO...';
        btn.disabled = true;

        try {
            const res = await fetch(BP_BASE + '/write', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ device: selectedDevice, data: zpl }),
            });

            if (res.ok) {
                btn.className = 'print-btn success';
                btn.innerHTML = '✓&nbsp;&nbsp;ETIQUETA ENVIADA';
                showMessage('Etiqueta de stock enviada correctamente.', 'success');
            } else {
                throw new Error('Status ' + res.status);
            }
        } catch (err) {
            btn.className = 'print-btn error';
            btn.innerHTML = '✗&nbsp;&nbsp;ERROR';
            showMessage('Error: ' + err.message, 'error');
        }

        setTimeout(() => {
            if (selectedDevice) {
                btn.className = 'print-btn ready';
                btn.innerHTML = '⬡&nbsp;&nbsp;IMPRIMIR ETIQUETA DE STOCK';
                btn.disabled = false;
            }
        }, 3000);
    }

    // ══════════════════════════════════════════════════════════
    //  BROWSER PRINT
    // ══════════════════════════════════════════════════════════

    function debugLog(msg, type) {
        const el = document.getElementById('debugContent');
        const cls = type === 'ok' ? 'log-ok' : type === 'err' ? 'log-err' : '';
        const time = new Date().toLocaleTimeString();
        el.innerHTML += `<div class="log-line ${cls}">[${time}] ${msg}</div>`;
    }

    function showMessage(html, type) {
        document.getElementById('messageArea').innerHTML = `<div class="message ${type}">${html}</div>`;
        setTimeout(() => { document.getElementById('messageArea').innerHTML = ''; }, 6000);
    }

    async function findPrinter() {
        const dot = document.getElementById('statusDot');
        const label = document.getElementById('statusLabel');
        const name = document.getElementById('printerName');
        const btn = document.getElementById('printBtn');

        dot.className = 'status-dot searching';
        label.textContent = 'Buscando impresora...';
        btn.className = 'print-btn disabled';
        btn.textContent = 'BUSCANDO IMPRESORA...';
        btn.disabled = true;

        try {
            const defaultRes = await fetch(BP_BASE + '/default?type=printer', { method: 'GET' });
            if (!defaultRes.ok) throw new Error('Status: ' + defaultRes.status);
            const defaultDevice = await defaultRes.json();

            if (defaultDevice && (defaultDevice.name || defaultDevice.uid)) {
                selectedDevice = defaultDevice;
                dot.className = 'status-dot connected';
                label.textContent = 'Impresora conectada';
                name.textContent = defaultDevice.name || defaultDevice.uid || 'Zebra USB';
                btn.className = 'print-btn ready';
                btn.innerHTML = '⬡&nbsp;&nbsp;IMPRIMIR ETIQUETA DE STOCK';
                btn.disabled = false;
                debugLog('Conectado: ' + (defaultDevice.name || defaultDevice.uid), 'ok');
            } else {
                dot.className = 'status-dot error';
                label.textContent = 'Sin impresora';
                btn.textContent = 'SIN IMPRESORA';
            }
        } catch (err) {
            dot.className = 'status-dot error';
            label.textContent = 'Error de conexión';
            btn.textContent = 'SIN CONEXIÓN';
            debugLog('Error: ' + err.message, 'err');
        }
    }

    window.addEventListener('load', () => setTimeout(findPrinter, 600));
</script>

</body>
</html>
