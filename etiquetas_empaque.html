<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Imprimir Etiquetas de Empaque - RUBIO</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=DM+Sans:wght@400;500;700&family=Roboto:wght@400;500;700;900&display=swap');
:root{
  --bg:#0c0f14; --surface:#141820; --surface2:#1a2030; --border:#2a3348;
  --amber:#3b82f6; --amber-dim:#2563eb; --green:#34d399; --red:#f87171;
  --text:#e2e8f0; --text-dim:#64748b;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;}
.header{width:100%;background:linear-gradient(135deg,var(--surface) 0%,var(--surface2) 100%);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:14px;}
.header-icon{height:36px;display:flex;align-items:center;}
.header-icon img{height:36px;width:auto;display:block;}
.header-text h1{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:700;color:var(--amber);letter-spacing:1.5px;}
.header-text span{font-size:11px;color:var(--text-dim);font-family:'IBM Plex Mono',monospace;letter-spacing:2px;}
.container{width:100%;max-width:640px;padding:20px 16px 60px;}
.printer-status{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:16px;}
.printer-status .left{display:flex;align-items:center;gap:12px;}
.status-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.status-dot.searching{background:var(--amber);animation:pulse 1.2s infinite;}
.status-dot.connected{background:var(--green);}
.status-dot.error{background:var(--red);}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
.status-label{font-size:13px;font-weight:600;}
.printer-name{font-size:11px;color:var(--text-dim);font-family:'IBM Plex Mono',monospace;}
.btn-retry{background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 14px;font-size:12px;cursor:pointer;font-family:'IBM Plex Mono',monospace;}
.printer-map{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:16px;}
.printer-map h3{font-size:11px;color:var(--text-dim);font-family:'IBM Plex Mono',monospace;letter-spacing:1px;margin-bottom:10px;}
.map-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.map-row label{min-width:90px;font-size:12px;color:var(--text-dim);}
.map-row select{flex:1;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:12px;font-family:inherit;}
.map-actions{display:flex;gap:8px;margin-top:6px;}
.map-actions button{background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;}
.summary-banner{background:linear-gradient(135deg,rgba(59,130,246,.12),rgba(37,99,235,.05));border:1px solid rgba(59,130,246,.3);border-radius:10px;padding:16px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;}
.summary-banner .np{font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:700;color:var(--amber);}
.summary-banner .meta{font-size:12px;color:var(--text-dim);font-family:'IBM Plex Mono',monospace;margin-top:4px;letter-spacing:1px;}
.summary-banner .badge{background:var(--amber);color:#fff;font-weight:700;font-size:16px;border-radius:8px;padding:8px 14px;font-family:'IBM Plex Mono',monospace;}
.section-title{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--amber);letter-spacing:1.5px;margin-bottom:12px;}
.label-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px;}
.label-card-head{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:12px;margin-bottom:14px;}
.label-card-head .ocl{color:var(--amber);}
.label-card-head .npr{color:var(--text-dim);}
.preview-wrap{display:flex;justify-content:center;margin-bottom:6px;}
.tam-label{text-align:center;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text-dim);margin-bottom:14px;letter-spacing:1px;}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.field{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:8px 10px;}
.field .k{font-size:9px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;}
.field .v{font-size:13px;font-weight:600;font-family:'IBM Plex Mono',monospace;margin-top:2px;}
.btn-print-single{width:100%;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px;font-size:12px;font-family:'IBM Plex Mono',monospace;letter-spacing:1px;cursor:pointer;}
.btn-print-single:hover{background:var(--amber);color:#fff;}
.btn-print-single.success{background:var(--green);color:#04231a;border-color:var(--green);}
.btn-print-single.error{background:var(--red);color:#2a0a0a;border-color:var(--red);}
.copies-control{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:16px;}
.copies-control label{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-dim);letter-spacing:1px;}
.copies-control input{width:70px;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px;font-size:14px;font-family:'IBM Plex Mono',monospace;}
.print-btn{width:100%;padding:16px;border:none;border-radius:10px;font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:700;letter-spacing:1px;cursor:pointer;background:var(--amber);color:#fff;}
.print-btn.disabled{opacity:.5;cursor:not-allowed;}
.print-btn.success{background:var(--green);color:#04231a;}
.print-btn.ready{background:var(--amber);}
.hint{text-align:center;margin-top:8px;font-size:11px;color:var(--text-dim);font-family:'IBM Plex Mono',monospace;}
.msg{margin-top:14px;padding:10px 14px;border-radius:8px;font-size:12px;}
.msg.error{background:rgba(248,113,113,.12);color:var(--red);border:1px solid rgba(248,113,113,.3);}
.msg.ok{background:rgba(52,211,153,.12);color:var(--green);border:1px solid rgba(52,211,153,.3);}
.debug-panel{margin-top:20px;}
.debug-toggle{background:none;border:none;color:var(--text-dim);font-family:'IBM Plex Mono',monospace;font-size:12px;cursor:pointer;}
.debug-content{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text-dim);background:#0a0d12;border:1px solid var(--border);border-radius:8px;padding:10px;max-height:180px;overflow:auto;margin-top:8px;white-space:pre-wrap;display:none;}
/* Preview de las 3 etiquetas de empaque apiladas (2x4 cada una) */
.emp-stack{display:flex;flex-direction:column;gap:6px;width:260px;}
.emp-lbl{background:#fff;color:#000;border-radius:3px;font-family:Arial,sans-serif;padding:8px 10px;width:260px;height:120px;box-sizing:border-box;overflow:hidden;}
/* Etiqueta 1: texto grande */
.emp1{display:flex;flex-direction:column;justify-content:center;gap:2px;}
.emp1 .l1{font-weight:800;font-size:22px;line-height:1;}
.emp1 .l2{font-weight:800;font-size:18px;line-height:1;}
.emp1 .l3{font-weight:800;font-size:18px;line-height:1;}
/* Etiqueta 2: códigos de barras */
.emp2{display:flex;flex-direction:column;justify-content:space-between;position:relative;}
.emp2 .top{display:flex;align-items:center;gap:6px;}
.emp2 .top b{font-size:12px;font-weight:900;}
.emp2 .top span{font-size:7px;}
.emp2 .fch{font-size:8px;font-weight:700;}
.emp2 .rowb{display:flex;align-items:center;gap:6px;}
.emp2 .rowb .k{font-size:7px;font-weight:700;width:70px;}
.emp2 .barcode{height:16px;flex:1;background:repeating-linear-gradient(90deg,#000 0,#000 1.5px,#fff 1.5px,#fff 3px);}
.emp2 .barnum{font-size:6px;text-align:center;}
.emp2 .cliente{position:absolute;right:8px;top:34px;font-size:9px;font-weight:800;}
/* Etiqueta 3: NP + piezas + RUBIO */
.emp3{display:flex;flex-direction:column;justify-content:center;gap:3px;position:relative;}
.emp3 .np{font-weight:800;font-size:24px;line-height:1;}
.emp3 .pz{font-weight:800;font-size:18px;line-height:1;}
.emp3 .rb{position:absolute;right:8px;bottom:8px;font-weight:800;font-size:14px;}
</style>
</head>
<body>
<div class="header">
  <div class="header-icon"><img src="logo.png" alt="RUBIO"></div>
  <div class="header-text">
    <h1>IMPRIMIR ETIQUETAS</h1>
    <span>ZEBRA BROWSER PRINT</span>
  </div>
</div>

<div class="container">
  <!-- Estado impresora -->
  <div class="printer-status">
    <div class="left">
      <div class="status-dot searching" id="statusDot"></div>
      <div>
        <div class="status-label" id="statusLabel">Buscando impresora...</div>
        <div class="printer-name" id="printerName">—</div>
      </div>
    </div>
    <button class="btn-retry" onclick="conectar()">Reintentar</button>
  </div>

  <!-- Mapeo impresora por tamaño -->
  <div class="printer-map">
    <h3>IMPRESORA POR TAMAÑO</h3>
    <div class="map-row"><label>4 x 6 in</label><select id="printer_4x6"></select></div>
    <div class="map-row"><label>2 x 4 in</label><select id="printer_2x4"></select></div>
    <div class="map-row"><label>1.25 x 1 in</label><select id="printer_125x1"></select></div>
    <div class="map-actions">
      <button onclick="guardarConfig()">Guardar</button>
      <button onclick="conectar()">Actualizar lista</button>
    </div>
  </div>

  <!-- Resumen -->
  <div class="summary-banner" id="summaryBanner"></div>

  <!-- Etiquetas -->
  <div class="section-title">▸ ETIQUETAS A IMPRIMIR</div>
  <div id="labelsList"></div>

  <!-- Copias -->
  <div class="copies-control">
    <label>COPIAS POR JUEGO:</label>
    <input type="number" id="copies" value="1" min="1" max="50">
  </div>

  <button class="print-btn disabled" id="printBtn" onclick="imprimirTodo()" disabled>BUSCANDO IMPRESORA...</button>
  <div class="hint">O usa el botón individual en cada etiqueta</div>

  <div id="messageArea"></div>

  <div class="debug-panel">
    <button class="debug-toggle" onclick="toggleDebug()">▸ Diagnóstico</button>
    <div class="debug-content" id="debugContent"></div>
  </div>
</div>

<script>
const P = new URLSearchParams(window.location.search);
const datos = {
  oc:P.get('oc')||'', linea:P.get('linea')||'', ocLinea:P.get('ocl')||'',
  np:P.get('np')||'', totalPzas:parseInt(P.get('total')||'0',10),
  numPaq:parseInt(P.get('paq')||'1',10), fecha:P.get('fecha')||'',
  cliente:P.get('cliente')||'', sede:P.get('sede')||'', tam:P.get('tam')||'2x4',
};
const BP_BASE="https://localhost:9101";
let allDevices=[];
const LOGO_BASE = "";  // misma carpeta que el HTML
// nombre de archivo del cliente: minúsculas, espacios -> guion bajo
function clienteArchivo(cli){
  if(!cli) return "";
  return cli.trim().toLowerCase().replace(/\s+/g,'_') + '.png';
}
// Cache de ^GF por nombre de archivo
const gfCache = {};
// Convertir una imagen (por URL) a comando ^GF de ZPL (monocromo)
function imagenAGF(url, maxW){
  return new Promise((resolve)=>{
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = function(){
      try{
        let w = img.width, h = img.height;
        if(maxW && w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
        // ancho en bytes (múltiplo de 8 bits)
        const wBytes = Math.ceil(w/8);
        const wPix = wBytes*8;
        const cv = document.createElement('canvas');
        cv.width = wPix; cv.height = h;
        const ctx = cv.getContext('2d');
        ctx.fillStyle = "#fff"; ctx.fillRect(0,0,wPix,h);
        ctx.drawImage(img,0,0,w,h);
        const data = ctx.getImageData(0,0,wPix,h).data;
        let hex = "";
        for(let y=0;y<h;y++){
          for(let b=0;b<wBytes;b++){
            let byte=0;
            for(let bit=0;bit<8;bit++){
              const x=b*8+bit;
              const idx=(y*wPix+x)*4;
              const r=data[idx],g=data[idx+1],bl=data[idx+2],a=data[idx+3];
              // pixel oscuro (y opaco) = 1 (negro en ZPL)
              const lum=(r+g+bl)/3;
              const negro=(a>128 && lum<128)?1:0;
              byte=(byte<<1)|negro;
            }
            hex += byte.toString(16).padStart(2,'0').toUpperCase();
          }
        }
        const total=wBytes*h;
        const gf=`^GFA,${total},${total},${wBytes},${hex}`;
        resolve({gf:gf, wBytes:wBytes, h:h});
      }catch(e){ resolve(null); }
    };
    img.onerror = function(){ resolve(null); };
    img.src = url;
  });
}
async function precargarLogo(nombre, maxW){
  if(!nombre) return null;
  if(gfCache[nombre]) return gfCache[nombre];
  const r = await imagenAGF(LOGO_BASE + nombre, maxW);
  gfCache[nombre] = r;
  return r;
}

function debugLog(m){const el=document.getElementById('debugContent');el.textContent+=`[${new Date().toLocaleTimeString()}] ${m}\n`;el.scrollTop=el.scrollHeight;}
function toggleDebug(){const d=document.getElementById('debugContent');d.style.display=d.style.display==='none'?'block':'none';}
function showMessage(m,t){document.getElementById('messageArea').innerHTML=`<div class="msg ${t}">${m}</div>`;}

// Reparto de piezas
function repartoPaquetes(total,num){const p=[];if(num<=0)return p;const base=Math.floor(total/num);const resto=total-base*num;for(let i=0;i<num;i++)p.push(i===num-1?base+resto:base);return p;}
const paquetes=repartoPaquetes(datos.totalPzas,datos.numPaq);
const tamNombre={'4x6':'4 × 6 in','2x4':'2 × 4 in','1.25x1':'1.25 × 1 in','125x1':'1.25 × 1 in'}[datos.tam]||'2 × 4 in';

// Banner resumen
document.getElementById('summaryBanner').innerHTML=
  `<div><div class="np">${datos.np||'—'}</div><div class="meta">${datos.totalPzas} PZAS · ${datos.numPaq} PAQUETE(S) · ${datos.cliente} · ${datos.sede}</div></div>
   <div class="badge">${paquetes.length*3}</div>`;

// Render de cada juego (una tarjeta por paquete)
function preview(cant){
  const lc = datos.cliente ? datos.cliente.toUpperCase() : '';
  return `<div class="emp-stack">
    <div class="emp-lbl emp1">
      <div class="l1">${datos.np}</div>
      <div class="l2">O.C. ${datos.oc}</div>
      <div class="l3">${cant} PZS  ${datos.linea}</div>
    </div>
    <div class="emp-lbl emp2">
      <div class="top"><img src="logo.png" style="height:14px;" onerror="this.replaceWith(Object.assign(document.createElement('b'),{textContent:'RUBIO'}))"><span>MAQUINADOS ESPECIALES RUBIO S.A. DE C.V.</span></div>
      <div class="fch">FECHA: ${datos.fecha}</div>
      <div class="rowb"><div class="k">NUMERO DE PARTE</div><div class="barcode"></div></div>
      <div class="rowb"><div class="k">CANTIDAD</div><div class="barcode" style="flex:0 0 90px;"></div></div>
      <div class="rowb"><div class="k">ORDEN DE COMPRA</div><div class="barcode"></div></div>
      <div class="cliente">${datos.cliente?`<img src="${clienteArchivo(datos.cliente)}" style="height:22px;" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'${lc}'}))">`:''}</div>
    </div>
    <div class="emp-lbl emp3">
      <div class="np">${datos.np}</div>
      <div class="pz">${cant} PIEZAS</div>
      <div class="rb"><img src="logo.png" style="height:16px;" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'RUBIO'}))"></div>
    </div>
  </div>`;
}
function renderLabels(){
  let html='';
  for(let i=0;i<paquetes.length;i++){
    const cant=paquetes[i];
    html+=`<div class="label-card">
      <div class="label-card-head"><span class="ocl">${datos.ocLinea}</span><span class="npr">Paquete ${i+1} de ${paquetes.length}</span></div>
      <div class="preview-wrap">${preview(cant)}</div>
      <div class="tam-label">${tamNombre} · juego de 3 etiquetas</div>
      <div class="fields">
        <div class="field"><div class="k">Número de Parte</div><div class="v">${datos.np}</div></div>
        <div class="field"><div class="k">Cantidad paquete</div><div class="v">${cant} pzas</div></div>
        <div class="field"><div class="k">Orden de Compra</div><div class="v">${datos.oc}</div></div>
        <div class="field"><div class="k">Línea</div><div class="v">${datos.linea}</div></div>
      </div>
      <button class="btn-print-single" id="btnSingle${i}" onclick="imprimirUno(${i})">🖨️ IMPRIMIR ESTE JUEGO</button>
    </div>`;
  }
  document.getElementById('labelsList').innerHTML=html;
}
renderLabels();

// ═══ Browser Print ═══
async function conectar(){
  const dot=document.getElementById('statusDot'), label=document.getElementById('statusLabel'), name=document.getElementById('printerName'), btn=document.getElementById('printBtn');
  dot.className='status-dot searching'; label.textContent='Buscando impresora...'; debugLog('Conectando a '+BP_BASE);
  allDevices=[];
  try{
    let defaultDevice=null;
    try{const r=await fetch(BP_BASE+'/default?type=printer');if(r.ok)defaultDevice=await r.json();}catch(e){debugLog('default: '+e.message);}
    let list=[];
    try{const r=await fetch(BP_BASE+'/available?type=printer');if(r.ok){const ld=await r.json();list=Array.isArray(ld)?ld:(ld.printer||ld.devices||[]);}}catch(e){debugLog('available: '+e.message);}
    if(defaultDevice&&(defaultDevice.name||defaultDevice.uid)&&list.length===0)list=[defaultDevice];
    allDevices=list;
    if(allDevices.length===0){
      dot.className='status-dot error'; label.textContent='Sin impresoras';
      name.innerHTML='Abre Browser Print y acepta el certificado en <a href="https://localhost:9101/ssl_support" target="_blank" style="color:var(--amber)">localhost:9101/ssl_support</a>';
      btn.className='print-btn disabled'; btn.disabled=true; btn.textContent='SIN IMPRESORA'; return;
    }
    dot.className='status-dot connected'; label.textContent='Impresora conectada';
    name.textContent=(allDevices[0].name||allDevices[0].uid);
    debugLog('Impresoras: '+allDevices.map(d=>d.name||d.uid).join(', '));
    llenarSelects();
    btn.className='print-btn ready'; btn.disabled=false; btn.textContent=`⬡ IMPRIMIR TODAS (${paquetes.length*3} ETIQUETAS)`;
  }catch(e){
    dot.className='status-dot error'; label.textContent='Error de conexión'; debugLog('Error: '+e.message);
  }
}
function llenarSelects(){
  const ids=['printer_4x6','printer_2x4','printer_125x1'];
  const g=JSON.parse(localStorage.getItem('empaque_printers')||'{}');
  ids.forEach(id=>{
    const sel=document.getElementById(id); sel.innerHTML='<option value="">— Seleccionar —</option>';
    allDevices.forEach((d,i)=>{const o=document.createElement('option');o.value=d.uid||i;o.textContent=d.name||d.uid;sel.appendChild(o);});
    if(g[id])sel.value=g[id];
  });
}
function guardarConfig(){
  const cfg={printer_4x6:document.getElementById('printer_4x6').value,printer_2x4:document.getElementById('printer_2x4').value,printer_125x1:document.getElementById('printer_125x1').value};
  localStorage.setItem('empaque_printers',JSON.stringify(cfg));
  showMessage('Configuración de impresoras guardada.','ok'); debugLog('Config: '+JSON.stringify(cfg));
}
function deviceParaTamano(tam){
  const cfg=JSON.parse(localStorage.getItem('empaque_printers')||'{}');
  let key='printer_2x4'; if(tam==='4x6')key='printer_4x6'; else if(tam==='1.25x1'||tam==='125x1')key='printer_125x1';
  let dev=allDevices.find(d=>(d.uid||'')===cfg[key]);
  if(!dev&&allDevices.length>0)dev=allDevices[0];
  return dev||null;
}

// ═══ ZPL (2x4in @203dpi = 812 x 406) ═══
function zplEtiqueta1(c){return `^XA
^CI28
^PW812
^LL406
^CF0,70,70
^FO40,40^FD${datos.np}^FS
^CF0,60,60
^FO40,140^FDO.C. ${datos.oc}^FS
^CF0,60,60
^FO40,240^FD${c} PZS  ${datos.linea}^FS
^XZ`;}
function zplEtiqueta2(c){
  const lc=datos.cliente?datos.cliente.toUpperCase():'';
  // Logo RUBIO (^GF) arriba-izquierda; si no cargó, texto "RUBIO"
  const gfRubio = gfCache['logo.png'];
  // gfRubio.gf ya es "^GFA,..." completo; lo anteponemos con su posición
  let rubioZpl = gfRubio ? `^FO40,15${gfRubio.gf}` : `^CF0,34,34\n^FO40,20^FDRUBIO^FS`;
  // Logo cliente (^GF) a la derecha; si no cargó, texto
  const gfCli = datos.cliente ? gfCache[clienteArchivo(datos.cliente)] : null;
  let cliZpl = gfCli ? `^FO600,150${gfCli.gf}` : `^CF0,30,30\n^FO640,160^FD${lc}^FS`;
  return `^XA
^CI28
^PW812
^LL406
${rubioZpl}
^CF0,22,22
^FO150,28^FDMAQUINADOS ESPECIALES RUBIO S.A. DE C.V.^FS
^FO40,64^FDFECHA: ${datos.fecha}^FS
^CF0,24,24
^FO40,110^FDNUMERO DE PARTE^FS
^BY2,2,45
^FO330,100^BCN,45,Y,N,N^FD${datos.np}^FS
^CF0,24,24
^FO40,185^FDCANTIDAD^FS
^BY2,2,45
^FO330,175^BCN,45,Y,N,N^FD${c}^FS
^CF0,24,24
^FO40,265^FDORDEN DE COMPRA^FS
^BY2,2,45
^FO330,255^BCN,45,Y,N,N^FD${datos.ocLinea}^FS
${cliZpl}
^XZ`;}
function zplEtiqueta3(c){
  const gfRubio = gfCache['logo.png'];
  let rubioZpl = gfRubio ? `^FO560,180${gfRubio.gf}` : `^CF0,50,50\n^FO600,210^FDRUBIO^FS`;
  return `^XA
^CI28
^PW812
^LL406
^CF0,80,80
^FO40,60^FD${datos.np}^FS
^CF0,70,70
^FO40,200^FD${c} PIEZAS^FS
${rubioZpl}
^XZ`;}

function zplJuego(c){return zplEtiqueta1(c)+'\n'+zplEtiqueta2(c)+'\n'+zplEtiqueta3(c)+'\n';}

async function enviarZPL(device,zpl){
  const res=await fetch(BP_BASE+'/write',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({device:device,data:zpl})});
  if(!res.ok){throw new Error('Status '+res.status+': '+await res.text());}
}

async function imprimirUno(i){
  const device=deviceParaTamano(datos.tam);
  if(!device){showMessage('No hay impresora para el tamaño '+datos.tam,'error');return;}
  await precargarLogos();
  const copies=parseInt(document.getElementById('copies').value)||1;
  const btn=document.getElementById('btnSingle'+i); btn.textContent='ENVIANDO...'; btn.disabled=true;
  try{
    let z=''; for(let k=0;k<copies;k++)z+=zplJuego(paquetes[i]);
    await enviarZPL(device,z);
    btn.className='btn-print-single success'; btn.textContent='✓ ENVIADO';
    debugLog('Juego '+(i+1)+' enviado a '+(device.name||device.uid));
  }catch(e){btn.className='btn-print-single error'; btn.textContent='✗ ERROR'; debugLog('Error: '+e.message);}
  setTimeout(()=>{btn.className='btn-print-single';btn.textContent='🖨️ IMPRIMIR ESTE JUEGO';btn.disabled=false;},3000);
}

async function imprimirTodo(){
  const device=deviceParaTamano(datos.tam);
  if(!device){showMessage('No hay impresora para el tamaño '+datos.tam+'. Configúrala y guarda.','error');return;}
  await precargarLogos();
  const copies=parseInt(document.getElementById('copies').value)||1;
  const btn=document.getElementById('printBtn'); btn.className='print-btn disabled'; btn.disabled=true;
  const total=paquetes.length*3*copies;
  btn.textContent=`ENVIANDO ${total} ETIQUETAS...`;
  debugLog('Imprimiendo todo: '+total+' etiquetas en '+(device.name||device.uid));
  try{
    let full='';
    for(let i=0;i<paquetes.length;i++){for(let k=0;k<copies;k++)full+=zplJuego(paquetes[i]);}
    await enviarZPL(device,full);
    btn.className='print-btn success'; btn.textContent=`✓ ${total} ETIQUETAS ENVIADAS`;
    showMessage('Enviadas '+total+' etiquetas ('+paquetes.length+' juegos).','ok');
    debugLog('Completado');
  }catch(e){btn.className='print-btn ready'; btn.disabled=false; btn.textContent='⬡ IMPRIMIR TODAS'; showMessage('Error: '+e.message,'error'); debugLog('Error: '+e.message);}
}

async function precargarLogos(){
  await precargarLogo('logo.png', 120);
  if(datos.cliente) await precargarLogo(clienteArchivo(datos.cliente), 160);
}
conectar();
precargarLogos();
