<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Etiquetas de Empaque — MERSA</title>
<style>
  :root{
    --bg:#0c0f14; --panel:#141922; --panel2:#1b2230; --line:#263042;
    --txt:#e6edf6; --muted:#8ea0b8; --accent:#3b82f6; --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--txt);font-family:'Segoe UI',system-ui,sans-serif;padding:24px 16px;min-height:100vh;}
  .wrap{max-width:760px;margin:0 auto;}
  h1{font-size:20px;margin-bottom:4px;}
  .sub{color:var(--muted);font-size:13px;margin-bottom:20px;}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;}
  .panel h2{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;}
  .row{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  .row label{min-width:130px;font-size:13px;color:var(--muted);}
  select,button{font-family:inherit;font-size:14px;border-radius:8px;}
  select{background:var(--panel2);color:var(--txt);padding:8px 10px;min-width:220px;border:1px solid var(--line);}
  button{cursor:pointer;padding:10px 18px;font-weight:600;border:none;}
  .btn-print{background:var(--accent);color:#fff;font-size:15px;width:100%;padding:14px;border-radius:8px;}
  .btn-print:hover{filter:brightness(1.1);}
  .btn-print:disabled{opacity:.5;cursor:not-allowed;}
  .btn-sm{background:var(--panel2);color:var(--txt);border:1px solid var(--line);padding:6px 12px;font-size:13px;border-radius:8px;}
  .status{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:12px;}
  .status.ok{background:rgba(34,197,94,.12);color:var(--ok);border:1px solid rgba(34,197,94,.3);}
  .status.err{background:rgba(239,68,68,.12);color:var(--bad);border:1px solid rgba(239,68,68,.3);}
  .status.info{background:rgba(59,130,246,.12);color:var(--accent);border:1px solid rgba(59,130,246,.3);}
  .status a{color:var(--accent);}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px;}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px;text-align:center;}
  .card .n{font-size:26px;font-weight:800;}
  .card .l{font-size:11px;color:var(--muted);text-transform:uppercase;margin-top:4px;}
  .pkg-list{font-size:13px;color:var(--muted);margin-bottom:16px;}
  #debug{font-family:monospace;font-size:11px;color:var(--muted);background:#0a0d12;border:1px solid var(--line);border-radius:8px;padding:10px;max-height:160px;overflow:auto;margin-top:12px;white-space:pre-wrap;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Etiquetas de Empaque</h1>
  <div class="sub">Maquinados Especiales Rubio — impresión vía Zebra Browser Print</div>

  <div id="bpStatus" class="status info">Conectando con Zebra Browser Print…</div>

  <div class="cards" id="resumen"></div>
  <div class="pkg-list" id="pkgDetalle"></div>

  <div class="panel">
    <h2>Impresora por tamaño de etiqueta</h2>
    <div class="row"><label>4 x 6 in</label><select id="printer_4x6"></select></div>
    <div class="row"><label>2 x 4 in</label><select id="printer_2x4"></select></div>
    <div class="row"><label>1.25 x 1 in</label><select id="printer_125x1"></select></div>
    <div class="row">
      <button class="btn-sm" onclick="guardarConfig()">Guardar configuración</button>
      <button class="btn-sm" onclick="conectar()">Actualizar lista</button>
    </div>
  </div>

  <button class="btn-print" id="btnImprimir" onclick="imprimirTodo()" disabled>🖨️ Imprimir etiquetas de empaque</button>

  <div id="debug"></div>
</div>

<script>
// ═══════════════ Parámetros desde la URL ═══════════════
const P = new URLSearchParams(window.location.search);
const datos = {
  oc:        P.get('oc') || '',
  linea:     P.get('linea') || '',
  ocLinea:   P.get('ocl') || '',
  np:        P.get('np') || '',
  totalPzas: parseInt(P.get('total') || '0', 10),
  numPaq:    parseInt(P.get('paq') || '1', 10),
  fecha:     P.get('fecha') || '',
  cliente:   P.get('cliente') || '',
  tam:       P.get('tam') || '2x4',
};

const BP_BASE = "https://localhost:9101";
let allDevices = [];

function debugLog(msg){
  const el = document.getElementById('debug');
  const t = new Date().toLocaleTimeString();
  el.textContent += `[${t}] ${msg}\n`;
  el.scrollTop = el.scrollHeight;
}
function setStatus(msg, tipo){
  const el = document.getElementById('bpStatus');
  el.innerHTML = msg;
  el.className = 'status ' + (tipo || 'info');
}

// ═══════════════ Reparto de piezas por paquete ═══════════════
function repartoPaquetes(total, num){
  const p = [];
  if (num <= 0) return p;
  const base = Math.floor(total / num);
  const resto = total - base * num;
  for (let i = 0; i < num; i++) p.push(i === num - 1 ? base + resto : base);
  return p;
}
const paquetes = repartoPaquetes(datos.totalPzas, datos.numPaq);

function pintarResumen(){
  document.getElementById('resumen').innerHTML =
    `<div class="card"><div class="n">${datos.np || '—'}</div><div class="l">Número de Parte</div></div>
     <div class="card"><div class="n">${datos.totalPzas}</div><div class="l">Total piezas</div></div>
     <div class="card"><div class="n">${datos.numPaq}</div><div class="l">Paquetes</div></div>`;
  const conteo = {};
  paquetes.forEach(q => conteo[q] = (conteo[q]||0)+1);
  const partes = Object.keys(conteo).sort((a,b)=>a-b).map(q => `${conteo[q]} paquete(s) × ${q} pzas`);
  document.getElementById('pkgDetalle').textContent = 'Reparto: ' + partes.join(' · ') + '  →  ' + (paquetes.length*3) + ' etiquetas';
}
pintarResumen();

// ═══════════════ Conexión Browser Print (mismo método que Ventas) ═══════════════
async function conectar(){
  setStatus('Conectando a Browser Print…', 'info');
  debugLog('Conectando a ' + BP_BASE);
  allDevices = [];
  try {
    let defaultDevice = null;
    try {
      const dRes = await fetch(BP_BASE + '/default?type=printer');
      if (dRes.ok) defaultDevice = await dRes.json();
    } catch(e){ debugLog('default falló: ' + e.message); }
    let list = [];
    try {
      const lRes = await fetch(BP_BASE + '/available?type=printer');
      if (lRes.ok){
        const ld = await lRes.json();
        list = Array.isArray(ld) ? ld : (ld.printer || ld.devices || []);
      }
    } catch(e){ debugLog('available falló: ' + e.message); }

    if (defaultDevice && (defaultDevice.name || defaultDevice.uid) && list.length === 0){
      list = [defaultDevice];
    }
    allDevices = list;

    if (allDevices.length === 0){
      setStatus('No se detectaron impresoras. Abre Browser Print y acepta el certificado en <a href="https://localhost:9101/ssl_support" target="_blank">https://localhost:9101/ssl_support</a>', 'err');
      document.getElementById('btnImprimir').disabled = true;
      return;
    }
    setStatus('Impresoras detectadas: ' + allDevices.length, 'ok');
    debugLog('Impresoras: ' + allDevices.map(d=>d.name||d.uid).join(', '));
    llenarSelects();
    document.getElementById('btnImprimir').disabled = false;
  } catch(e){
    setStatus('No se pudo conectar con Browser Print. Ábrelo e inténtalo de nuevo.', 'err');
    debugLog('Error conexión: ' + e.message);
  }
}

function llenarSelects(){
  const ids = ['printer_4x6','printer_2x4','printer_125x1'];
  const guardado = JSON.parse(localStorage.getItem('empaque_printers') || '{}');
  ids.forEach(id => {
    const sel = document.getElementById(id);
    sel.innerHTML = '<option value="">— Seleccionar —</option>';
    allDevices.forEach((d, i) => {
      const opt = document.createElement('option');
      opt.value = d.uid || i;
      opt.textContent = d.name || d.uid;
      sel.appendChild(opt);
    });
    if (guardado[id]) sel.value = guardado[id];
  });
}

function guardarConfig(){
  const cfg = {
    printer_4x6:   document.getElementById('printer_4x6').value,
    printer_2x4:   document.getElementById('printer_2x4').value,
    printer_125x1: document.getElementById('printer_125x1').value,
  };
  localStorage.setItem('empaque_printers', JSON.stringify(cfg));
  setStatus('Configuración de impresoras guardada.', 'ok');
  debugLog('Config guardada: ' + JSON.stringify(cfg));
}

function deviceParaTamano(tam){
  const cfg = JSON.parse(localStorage.getItem('empaque_printers') || '{}');
  let key = 'printer_2x4';
  if (tam === '4x6') key = 'printer_4x6';
  else if (tam === '1.25x1' || tam === '125x1') key = 'printer_125x1';
  const uid = cfg[key];
  let dev = allDevices.find(d => (d.uid||'') === uid);
  if (!dev && allDevices.length > 0) dev = allDevices[0];
  return dev || null;
}

// ═══════════════ ZPL de las 3 etiquetas (2x4in @203dpi = 812 x 406 dots) ═══════════════
function zplEtiqueta1(cantPaquete){
  return `^XA
^CI28
^PW812
^LL406
^CF0,70,70
^FO40,40^FD${datos.np}^FS
^CF0,60,60
^FO40,140^FDO.C. ${datos.oc}^FS
^CF0,60,60
^FO40,240^FD${cantPaquete} PZS  ${datos.linea}^FS
^XZ`;
}
function zplEtiqueta2(cantPaquete){
  const logoCliente = datos.cliente ? datos.cliente.toUpperCase() : '';
  return `^XA
^CI28
^PW812
^LL406
^CF0,34,34
^FO40,20^FDRUBIO^FS
^CF0,22,22
^FO150,28^FDMAQUINADOS ESPECIALES RUBIO S.A. DE C.V.^FS
^FO40,64^FDFECHA: ${datos.fecha}^FS
^CF0,24,24
^FO40,110^FDNUMERO DE PARTE^FS
^BY2,2,45
^FO330,100^BCN,45,Y,N,N^FD${datos.np}^FS
^CF0,24,24
^FO40,185^FDCANTIDAD^FS
^BY2,2,45
^FO330,175^BCN,45,Y,N,N^FD${cantPaquete}^FS
^CF0,24,24
^FO40,265^FDORDEN DE COMPRA^FS
^BY2,2,45
^FO330,255^BCN,45,Y,N,N^FD${datos.ocLinea}^FS
^CF0,30,30
^FO640,160^FD${logoCliente}^FS
^XZ`;
}
function zplEtiqueta3(cantPaquete){
  return `^XA
^CI28
^PW812
^LL406
^CF0,80,80
^FO40,60^FD${datos.np}^FS
^CF0,70,70
^FO40,200^FD${cantPaquete} PIEZAS^FS
^CF0,50,50
^FO600,210^FDRUBIO^FS
^XZ`;
}

async function enviarZPL(device, zpl){
  const res = await fetch(BP_BASE + '/write', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ device: device, data: zpl }),
  });
  if (!res.ok){
    const t = await res.text();
    throw new Error('Status ' + res.status + ': ' + t);
  }
}

async function imprimirTodo(){
  const device = deviceParaTamano(datos.tam);
  if (!device){
    setStatus('No hay impresora asignada para el tamaño ' + datos.tam + '. Configúrala y guarda.', 'err');
    return;
  }
  const btn = document.getElementById('btnImprimir');
  btn.disabled = true;
  const totalEt = paquetes.length * 3;
  setStatus('Enviando ' + totalEt + ' etiquetas a ' + (device.name||device.uid) + '…', 'info');
  debugLog('Imprimiendo ' + paquetes.length + ' juegos en ' + (device.name||device.uid));
  try {
    let fullZpl = '';
    for (let i = 0; i < paquetes.length; i++){
      const q = paquetes[i];
      fullZpl += zplEtiqueta1(q) + '\n' + zplEtiqueta2(q) + '\n' + zplEtiqueta3(q) + '\n';
    }
    await enviarZPL(device, fullZpl);
    setStatus('✓ Enviadas ' + totalEt + ' etiquetas (' + paquetes.length + ' juegos).', 'ok');
    debugLog('Envío completado: ' + totalEt + ' etiquetas');
  } catch(e){
    setStatus('Error al enviar: ' + e.message, 'err');
    debugLog('Error write: ' + e.message);
  }
  btn.disabled = false;
}

conectar();
</script>
</body>
</html>
